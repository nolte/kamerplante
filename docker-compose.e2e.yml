##
## Kamerplanter – E2E Test Environment (Docker Compose)
##
## Runs the full application stack + Selenium Grid + test runner
## in an isolated network. No host ports required — runs in parallel
## with Kind/Skaffold without conflicts.
##
## Usage (light mode — no auth, skips requires_auth tests):
##   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit
##
## Usage (full mode — with auth, runs ALL tests including login/tenant):
##   docker compose -f docker-compose.e2e.yml --profile full \
##     up e2e-tests-full --build --abort-on-container-exit
##
## Usage (mobile — iPhone 14 Pro viewport, touch emulation):
##   docker compose -f docker-compose.e2e.yml --profile mobile \
##     up e2e-tests-mobile --build --abort-on-container-exit
##
## Usage (tablet — iPad Air viewport, touch emulation):
##   docker compose -f docker-compose.e2e.yml --profile tablet \
##     up e2e-tests-tablet --build --abort-on-container-exit
##
## Usage (full + mobile combined):
##   docker compose -f docker-compose.e2e.yml --profile full-mobile \
##     up e2e-tests-full-mobile --build --abort-on-container-exit
##
## Reports are written to ./test-reports/ on the host.
##

services:
  # ── ArangoDB ──────────────────────────────────────────────
  arangodb:
    image: arangodb:3.12@sha256:39bbca489179ea03f2b24b7ea4e4c4cb5258f6474f8c1c4d9bd65f7cd6d211a5
    environment:
      ARANGO_ROOT_PASSWORD: e2e-test-password
    healthcheck:
      test: ["CMD", "arangosh", "--server.password", "e2e-test-password", "--javascript.execute-string", "db._version()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Valkey (Redis-compatible) ────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── TimescaleDB (optional) ─────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.30.0-pg16@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
    profiles: ["timescaledb"]
    environment:
      POSTGRES_DB: kamerplanter_sensors_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./src/backend
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: kamerplanter_e2e
      ARANGODB_USERNAME: root
      ARANGODB_PASSWORD: e2e-test-password
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: '["http://frontend"]'
      DEBUG: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      JWT_SECRET_KEY: e2e-test-jwt-secret-not-for-production
      # AP-4 / INF-S5 startup gate (app/main.py): with DEBUG=false the backend
      # refuses to start unless these secrets are provisioned. Test-only values.
      FERNET_KEY: QM78OImM6D7dpoyt3CDJDvfEyj68skxmfC9XWO9Bl6Q=
      ERASURE_TOMBSTONE_SALT: e2e-test-tombstone-salt-not-for-production-32chars
      KAMERPLANTER_MODE: light
    depends_on:
      arangodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
      # The backend runs the full light-mode seed (210 species + cultivars)
      # inside the FastAPI lifespan *before* uvicorn binds, so /health/live is
      # unreachable during seeding. Measured time-to-healthy: ~51 s isolated,
      # >78 s under full-stack concurrent boot. Without a start_period the 15×5 s
      # retry budget (~75 s) trips the container unhealthy mid-seed, and frontend
      # (depends_on: backend healthy) never starts. During start_period a failing
      # check does not count toward retries or mark the container unhealthy.
      start_period: 180s

  # ── Celery Worker ────────────────────────────────────────
  celery-worker:
    build:
      context: ./src/backend
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: kamerplanter_e2e
      ARANGODB_USERNAME: root
      ARANGODB_PASSWORD: e2e-test-password
      REDIS_URL: redis://valkey:6379/0
      JWT_SECRET_KEY: e2e-test-jwt-secret-not-for-production
      KAMERPLANTER_MODE: light
    depends_on:
      arangodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A app.tasks worker --loglevel=info
    # The worker runs no HTTP server, so the backend image's inherited
    # HTTP healthcheck (curl :8000) can never pass. Disable it — nothing
    # depends_on this service being healthy, and it otherwise breaks
    # `docker compose up --wait`.
    healthcheck:
      disable: true

  # ── Frontend (React + nginx) ─────────────────────────────
  frontend:
    build:
      context: ./src/frontend
    environment:
      KAMERPLANTER_MODE: light
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Selenium Hub ─────────────────────────────────────────
  selenium-hub:
    image: selenium/hub:4.48@sha256:d47c27474cb4cf356afa0a20c8eed8c3cf3a25c1b8e375357e6a0911e374d1da
    environment:
      SE_SESSION_REQUEST_TIMEOUT: "300"
      SE_NODE_SESSION_TIMEOUT: "300"
      SE_OTEL_TRACES_EXPORTER: none

  # ── Chrome Node ──────────────────────────────────────────
  chrome:
    image: selenium/node-chrome:152.0@sha256:5ac71fd8dd1ef5fb90ff38d01a6040185c3d16481479f96fdc888dbbed18a96a
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_OTEL_TRACES_EXPORTER: none
    shm_size: "2gb"

  # ── E2E Test Runner ──────────────────────────────────────
  e2e-tests:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend:8080
      KAMERPLANTER_MODE: light
    depends_on:
      frontend:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-default.xml
      - --base-url=http://frontend:8080
      - --app-mode=light

  # ── E2E Core CRUD Tests (species, cultivar, sites) ─────
  e2e-core-crud:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend:8080
      KAMERPLANTER_MODE: light
    depends_on:
      frontend:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["core-crud"]
    entrypoint:
      - pytest
      - -m
      - core_crud
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-core-crud.xml
      - --base-url=http://frontend:8080
      - --app-mode=light

  # ── E2E Smoke Tests (fast ~2min) ────────────────────────
  e2e-smoke:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend:8080
      KAMERPLANTER_MODE: light
    depends_on:
      frontend:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["smoke"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - -m
      - smoke
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-smoke.xml
      - --base-url=http://frontend:8080
      - --app-mode=light

  # ═══════════════════════════════════════════════════════════════
  #  Full-Auth Profile — runs ALL tests including requires_auth
  #
  #  Usage:
  #    docker compose -f docker-compose.e2e.yml --profile full \
  #      up e2e-tests-full --build --abort-on-container-exit
  #
  #  Uses separate DB (kamerplanter_e2e_full) and Redis DB 1
  #  so it can coexist with the light-mode services.
  # ═══════════════════════════════════════════════════════════════

  # ── Backend (full mode) ──────────────────────────────────────
  backend-full:
    build:
      context: ./src/backend
    # NFR-013 local-fs object storage (STORAGE_LOCAL_FS_ROOT defaults to
    # /data/attachments): the hardened image runs non-root and ships no /data,
    # so photo uploads (REQ-034) fail with PermissionError. A per-run tmpfs
    # (docker default mode 1777) makes the root writable; contents are
    # deliberately ephemeral. Not shared with celery-worker-full — the only
    # worker-side attachment readers (pest dataset acquisition) are not
    # exercised by the E2E suite.
    tmpfs:
      - /data
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: kamerplanter_e2e_full
      ARANGODB_USERNAME: root
      ARANGODB_PASSWORD: e2e-test-password
      REDIS_URL: redis://valkey:6379/1
      CORS_ORIGINS: '["http://frontend-full"]'
      DEBUG: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      JWT_SECRET_KEY: e2e-test-jwt-secret-not-for-production
      # AP-4 / INF-S5 startup gate (app/main.py): with DEBUG=false the backend
      # refuses to start unless these secrets are provisioned. Test-only values.
      FERNET_KEY: QM78OImM6D7dpoyt3CDJDvfEyj68skxmfC9XWO9Bl6Q=
      ERASURE_TOMBSTONE_SALT: e2e-test-tombstone-salt-not-for-production-32chars
      KAMERPLANTER_MODE: full
      COOKIE_SECURE: "false"
      # Both limits are per **client IP** and sized for production, where one
      # address is roughly one human. This harness violates that assumption by
      # construction: four xdist workers drive four browsers through a single
      # Selenium node, so the backend sees every request from one address.
      #
      # RATE_LIMIT_AUTH was already raised for the login path. The refresh path
      # was missed, and it is the busier of the two — `AuthProvider` dispatches a
      # refresh on **every** app bootstrap, which for an E2E suite means every
      # `page.open()`.
      #
      # Measured on the 2026-08-15 nightly (`e2e-nightly` run 31859469145,
      # profile `full`): 4 137 refresh calls in 38 minutes, **289 refused with
      # 429**. Median 34/minute against a 60/minute budget — so the average was
      # never the problem. The peak minute was 63, and the refusals come from
      # *bursts*: four browsers navigating together exhaust a minute's budget in
      # seconds, and everything for the rest of that minute is refused.
      #
      # A refused refresh drops the browser to logged-out, and every subsequent
      # `page.open()` then times out waiting for a page it never reaches. That is
      # what the 119 failures were: every one a `TimeoutException` at page open,
      # spread evenly over all four workers (30/30/30/29), and only in the three
      # profiles that authenticate — `light`, `mobile` and `tablet` passed.
      #
      # Ten times the production budget, matching the RATE_LIMIT_AUTH precedent
      # above and leaving an order of magnitude over the observed peak.
      RATE_LIMIT_AUTH: "200/minute"
      RATE_LIMIT_TOKEN_REFRESH: "600/minute"
      # A *second* account, with platform-admin rights (#1155). Not the demo
      # user: much of this suite asserts what an ordinary member is refused, and
      # promoting the single account those cases share would leave every one of
      # them green while checking nothing.
      #
      # The seed behind these two variables refuses unless `cookie_secure` is
      # also off, so a copied compose file or a leaked environment cannot mint an
      # administrator on its own. See app/migrations/seed_e2e_platform_admin.py.
      E2E_PLATFORM_ADMIN_EMAIL: e2e-admin@kamerplanter.example
      E2E_PLATFORM_ADMIN_PASSWORD: e2e-admin-passwort-2026
    depends_on:
      arangodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15
      # Same lifespan-seed-before-uvicorn-binds timing as the light backend
      # (see its healthcheck comment). Parity fix — full mode is out of scope
      # for this run but shares the identical latent unhealthy-mid-seed bug.
      start_period: 180s
    profiles: ["full"]

  # ── Celery Worker (full mode) ────────────────────────────────
  celery-worker-full:
    build:
      context: ./src/backend
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: kamerplanter_e2e_full
      ARANGODB_USERNAME: root
      ARANGODB_PASSWORD: e2e-test-password
      REDIS_URL: redis://valkey:6379/1
      JWT_SECRET_KEY: e2e-test-jwt-secret-not-for-production
      KAMERPLANTER_MODE: full
      COOKIE_SECURE: "false"
    depends_on:
      arangodb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A app.tasks worker --loglevel=info
    # The worker runs no HTTP server, so the backend image's inherited
    # HTTP healthcheck (curl :8000) can never pass. Disable it — nothing
    # depends_on this service being healthy.
    healthcheck:
      disable: true
    profiles: ["full"]

  # ── Frontend (full mode) ─────────────────────────────────────
  frontend-full:
    build:
      context: ./src/frontend
    environment:
      KAMERPLANTER_MODE: full
      BACKEND_HOST: backend-full
    depends_on:
      backend-full:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["full"]

  # ── E2E Test Runner (full mode) ──────────────────────────────
  e2e-tests-full:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend-full:8080
      KAMERPLANTER_MODE: full
    depends_on:
      frontend-full:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["full"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-full.xml
      - --base-url=http://frontend-full:8080
      - --app-mode=full

  # ═══════════════════════════════════════════════════════════════
  #  Mobile / Tablet Profiles — responsive testing
  #
  #  Usage (light mode, mobile):
  #    docker compose -f docker-compose.e2e.yml --profile mobile \
  #      up e2e-tests-mobile --build --abort-on-container-exit
  #
  #  Usage (light mode, tablet):
  #    docker compose -f docker-compose.e2e.yml --profile tablet \
  #      up e2e-tests-tablet --build --abort-on-container-exit
  #
  #  Usage (full mode, mobile):
  #    docker compose -f docker-compose.e2e.yml --profile full-mobile \
  #      up e2e-tests-full-mobile --build --abort-on-container-exit
  # ═══════════════════════════════════════════════════════════════

  # ── E2E Mobile (light mode) ─────────────────────────────────
  e2e-tests-mobile:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend:8080
      E2E_DEVICE: mobile
      KAMERPLANTER_MODE: light
    depends_on:
      frontend:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["mobile"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-mobile.xml
      - --base-url=http://frontend:8080
      - --app-mode=light
      - --device=mobile

  # ── E2E Tablet (light mode) ─────────────────────────────────
  e2e-tests-tablet:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend:8080
      E2E_DEVICE: tablet
      KAMERPLANTER_MODE: light
    depends_on:
      frontend:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["tablet"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-tablet.xml
      - --base-url=http://frontend:8080
      - --app-mode=light
      - --device=tablet

  # ── E2E Mobile (full mode) ──────────────────────────────────
  e2e-tests-full-mobile:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend-full:8080
      E2E_DEVICE: mobile
      KAMERPLANTER_MODE: full
    depends_on:
      frontend-full:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["full-mobile"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-full-mobile.xml
      - --base-url=http://frontend-full:8080
      - --app-mode=full
      - --device=mobile

  # ── E2E Tablet (full mode) ──────────────────────────────────
  e2e-tests-full-tablet:
    build:
      context: ./tests/e2e
    environment:
      SELENIUM_REMOTE_URL: http://selenium-hub:4444/wd/hub
      E2E_BASE_URL: http://frontend-full:8080
      E2E_DEVICE: tablet
      KAMERPLANTER_MODE: full
    depends_on:
      frontend-full:
        condition: service_healthy
      chrome:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./test-reports:/app/test-reports
    profiles: ["full-tablet"]
    entrypoint:
      - pytest
      - -n
      - "4"
      - --dist=loadfile
      - --tb=short
      - --generate-protocol
      - --junitxml=test-reports/e2e/junit-full-tablet.xml
      - --base-url=http://frontend-full:8080
      - --app-mode=full
      - --device=tablet
