# yaml-language-server: $schema=./schemas/substrates.schema.yaml
# ==============================================================================
# SUBSTRATES — Standard substrate products (REQ-019)
# ==============================================================================
# Dedicated seed data for the `substrates` collection, loaded by
# app/migrations/seed_substrates.py.  Values are the original REQ-019 catalog
# records; do not invent or alter numeric values here.
#
# SOURCING CONVENTION (added with #1175, because the file had none)
# ----------------------------------------------------------------
# "Do not invent" is not "do not correct".  A value MAY be changed when an
# authoritative external source states it, and then the source is recorded **in
# the record**, immediately above the value, as:
#
#   # Source: <publisher>, <document>, retrieved <YYYY-MM-DD> — <URL>
#   # "<the verbatim sentence the value comes from>"
#
# A manufacturer's own data sheet or regulatory declaration counts.  A number
# reasoned to, interpolated, or found on a content-farm page does not — that is
# the invention the paragraph above forbids, and it is worse than an open item
# because it looks settled.  Where no such source could be found, the record
# keeps its value and the violation stays registered in `_KNOWN_OPEN` in
# tests/unit/migrations/test_substrate_invariants.py, which fails both on an
# unregistered violation and on a register entry whose defect has been fixed.
#
# A citation is also a legitimate way to CONFIRM a value that was doubted; see
# `Plagron Allmix` below, whose EC an issue reported as too high and the
# manufacturer's published range says is correct.
#
# pH CONVENTION (stated with #1175, because #1332 found the file silent on it)
# --------------------------------------------------------------------------
# `ph_base` is the pH of a WATER extract (pH-H₂O). Not CaCl₂. The extraction
# ratio is not fixed by this catalogue and is recorded per source where the
# source states it: Plagron publishes at 1:1.5 v/v (the RHP method), EN 13037
# specifies 1:5 v/v, a saturated-media extract is a third. Those differ by
# tenths of a unit; H₂O against CaCl₂ differs by half a unit to a whole one
# (LECHUZA-PON declares 8.2 against 7.1; LVG Hannover-Ahlem measured Sphagnum
# at 3.2–3.4 in CaCl₂ where the water-extract literature says 3.5–4.5), and
# that is the difference that has to be pinned.
#
# Why water and not CaCl₂, given that German declarations (DüMV) tend to state
# CaCl₂: every consumer of this field compares it against a water measurement.
# `SubstrateLifecycleManager` reads it beside a batch's `ph_history`, which a
# grower fills from a meter in run-off or a slurry; `calculate_mix_properties`
# averages it into a mix a grower then measures the same way; the MCP feeding
# judgement passes it to a model reasoning in the grower's units. A CaCl₂ value
# would read as "this medium is half a unit more acidic than your meter says".
# The three sourced Plagron records are water-extract values, and the generic
# records (white peat 3.8, sphagnum 4.2, coco 6.0) sit in the water-extract
# literature ranges, not the CaCl₂ ones. So the convention is the one the data
# already mostly followed; what was missing was the sentence.
#
# Consequences: a manufacturer that declares both is cited at its H₂O value
# (LECHUZA-PON below, 6.8 → 8.2). A record whose only source is CaCl₂ is NOT
# converted — the offset is medium-dependent — and stays an open item. BioBizz
# publishes pH ranges without naming a method; those records are unsourced on
# this axis, not outliers.

