  # ── PON Mineral Substrate ─────────────────────────────────────────

  - type: pon_mineral
    brand: "Lechuza"
    name_de: "Lechuza PON (Mineralsubstrat)"
    name_en: "Lechuza PON (Mineral Substrate)"
    # Was 6.8 — inside REQ-019's generic "pH-neutral (6.0–7.0)" line for the type,
    # and matching neither figure the manufacturer declares. The declaration
    # states two, under two methods: "pH-Wert (H₂O): 8,2" and "pH-Wert (CaCl₂):
    # 7,1". #1332 left it because this file did not say which convention
    # `ph_base` uses; the header now does (water extract), so the H₂O figure is
    # the one that belongs here — the sentence that settles the field settles the
    # record, and it is no longer a coin flip. 8.2 is alkaline, which is what a
    # pumice/lava/zeolite granulate is; REQ-019's "6.0–7.0" describes the type,
    # this is a product record with a declaration.
    #
    # Source: LECHUZA (geobra Brandstätter), product declaration
    # "LECHUZA-PON 3 L, 6 L, 12 L, 18 L, 30 L" (EU 2019/1009 Düngeprodukt-
    # Deklaration, PFC 7), retrieved 2026-09-03 —
    # https://media.lechuza.com/lechuza-declaration-lechuza-pon.pdf
    # "Produktspezifische Deklaration: Elektrische Leitfähigkeit (EC): 5 mS/m /
    #  pH-Wert (H₂O): 8,2 / K₂O (Kaliumoxid CAT): 170 mg/l"
    # "pH-Wert (CaCl₂): 7,1"
    ph_base: 8.2
    # Was 0.0, which contradicted the 5 % `langzeitduenger` two blocks down
    # (#1152 §B). #1152 could not tell which half was wrong; the manufacturer's
    # declaration settles both. It lists the fertiliser as an ingredient, so the
    # component stays — and it publishes the conductivity, so the EC was the wrong
    # half.
    #
    # 5 mS/m = 0.05 mS/cm (1 mS/cm = 100 mS/m). Near zero, but not zero, and the
    # declaration says why: the granulate is "100 % umhüllt" (fully coated,
    # Multicote controlled-release), so it contributes almost nothing to the
    # immediate extract. That is a measured near-zero, not the absence of a
    # measurement — and `ec_base_ms` is subtracted as EC-net in
    # `calculate_mixing_protocol`, so the difference between "0.0, unknown" and
    # "0.05, declared" is the difference between a guess and a value.
    #
    # Source: LECHUZA (geobra Brandstätter), product declaration
    # "LECHUZA-PON 3 L, 6 L, 12 L, 18 L, 30 L" (EU 2019/1009 Düngeprodukt-
    # Deklaration, PFC 7), retrieved 2026-09-01 —
    # https://media.lechuza.com/lechuza-declaration-lechuza-pon.pdf
    # "Produktspezifische Deklaration: Elektrische Leitfähigkeit (EC): 5 mS/m /
    #  pH-Wert (H₂O): 8,2 / K₂O (Kaliumoxid CAT): 170 mg/l"
    # "Inhaltsstoffe: Kultursubstrat (PFC 4) bestehend aus Bims […], Lava,
    #  Zeolith […] / festes anorganisches Mehrnährstoff-Makronährstoff-
    #  Düngemittel NPK 15-11-14+2+ME […] 100 % umhüllt"
    ec_base_ms: 0.05
    water_retention: medium
    air_porosity_percent: 40.0
    composition:
      bims: 0.35
      zeolith: 0.35
      lava: 0.25
      langzeitduenger: 0.05
    buffer_capacity: medium
    reusable: true
    max_reuse_cycles: 8
    water_holding_capacity_percent: 30.0
    easily_available_water_percent: 12.0
    cec_meq_per_100cm3: 12.0
    particle_size_mm: 6.0
    bulk_density_g_per_l: 600.0
    irrigation_strategy: moderate

  # ── Sphagnum Moss ─────────────────────────────────────────────────

  - type: sphagnum
    brand: ""
    name_de: "Sphagnum-Moos (getrocknet)"
    name_en: "Sphagnum Moss (Dried)"
    ph_base: 4.2
    ec_base_ms: 0.05
    water_retention: high
    # Was 25.0, with water_holding 80.0: 105 % of one pore space (#1152 §A), and
    # the last `_KNOWN_OPEN` entry. #1332 searched and found no air/water pair.
    # This pair is measured on dried Sphagnum at this record's own bulk density,
    # under the convention the field is defined in: container capacity is the
    # water held against -10 hPa (pF 1), which is what EN 13041 measures and what
    # the peat and coco records here are consistent with.
    #
    # Kämäräinen et al. re-packed dried Sphagnum LOOSELY at 40 mm fibre length —
    # the closest analogue to a bag of dried long-fibre moss — and it settled at
    # a bulk density of ≈30 g/dm³ (Figure 5, top left), i.e. this record's 30 g/L.
    # Its water content at pF 1 is ≈28 vol-% (Figure 5, top right; read from the
    # chart, ±2). Total porosity is printed: 97.4–97.8 %. Air capacity is, in the
    # paper's own definition, total pore volume minus water at pF 1:
    # 97.6 − 28 ≈ 70 vol-%.
    #
    # Why the old 80 was not simply "wrong": it is the OTHER convention. Müller &
    # Glatzel measure the same material at the same density (0.03 g/cm³) after
    # saturation and free drainage and get 28.4 g water per g dry mass, which is
    # 0.03 × 28.4 = 85 vol-%. Dried Sphagnum has a bimodal pore space; the large
    # inter-fibre pores drain between "just drained" and -10 hPa, so the two
    # readings differ by a factor of three for this material and by a few points
    # for peat. The field is defined at -10 hPa, so 28 is the value that belongs
    # in it. `water_retention: high` stays: REQ-019 fixes it for the type, and on
    # a dry-mass basis this is the most water-retentive medium in either source
    # (28.4 g/g against 6.4 g/g for peat) — which is what a grower handling wet
    # moss experiences, and what REQ-019's quantitative WHC bands (low < 30 %)
    # do not capture for a medium this light.
    #
    # Source: Kämäräinen, A., Simojoki, A., Lindén, L., Jokinen, K. & Silvan, N.
    # (2018), "Physical growing media characteristics of Sphagnum biomass
    # dominated by Sphagnum fuscum (Schimp.) Klinggr.", Mires and Peat 21(17),
    # 1–16, doi:10.19189/MaP.2017.OMB.278, retrieved 2026-09-03 —
    # https://www.mires-and-peat.net/article/128965-physical-growing-media-characteristics-of-_sphagnum_-biomass-dominated-by-_sphagnum-fuscum_-schimp-klinggr.pdf
    # "The total porosity of Sphagnum moss ranged from 97.4 % to 97.8 % with no
    #  significant differences."
    # "[…] a severe reduction in its air capacity, i.e. in the difference between
    #  the total pore volume and the volume of water-occupied pores at pF 1."
    # "Our method differed from EN 13041 (the European standard; SFS-EN 13041)
    #  procedures by using 72.1 mm diameter cylinders instead of the standard
    #  100 mm ones"
    # Figure 5: "Bulk densities (BD) and volumetric water retention of experimental
    #  materials under differing matric potentials (pF1, pF2 and pF3)." — S. 40 mm:
    #  BD ≈ 30 g/dm³, water ≈ 28 vol-% at pF 1, ≈ 19 at pF 2, ≈ 10 at pF 3.
    # Cross-check from the same paper's printed regression for compacted moss
    # (Figure 8, BD 40–80 g/dm³): "y=1.1321BD-2.096" gives 43 vol-% at 40 g/dm³ —
    # denser than this record and wetter, as it should be.
    air_porosity_percent: 70.0
    composition:
      sphagnum: 1.0
    buffer_capacity: low
    reusable: false
    max_reuse_cycles: 1
    # Was 80.0 — see the note above `air_porosity_percent`.
    water_holding_capacity_percent: 28.0
    # Was 40.0, which is now impossible (a plant cannot extract more than the 28
    # held). Same source, same sample: water between pF 1 and pF 2 ≈ 28 − 19 = 9
    # vol-% (Figure 5). That is the 10–100 hPa band, which the paper's Figure 7
    # labels "readily available" plus "easily available"; the strict de Boodt
    # band (10–50 hPa) lies inside it and is not printed for this sample, so 9 is
    # the widest reading of the field and a narrower one cannot be sourced here.
    easily_available_water_percent: 9.0
    cec_meq_per_100cm3: 8.0
    # UNCHANGED, and now corroborated twice: Kämäräinen's loosely packed 40 mm
    # fibres sit at ≈30 g/dm³ (above), and Müller & Glatzel's processed biomass at
    # "0.03 ± 0.0304" g/cm³. Gaudig et al. (2018) give 8.5–25 g/L for shredded and
    # long-fibre material (recorded under #1332).
    #
    # Source: Müller, R. & Glatzel, S. (2021), "Sphagnum farming substrate is a
    # competitive alternative to traditional horticultural substrates for
    # achieving desired hydro-physical properties", Mires and Peat 27(21),
    # doi:10.19189/MaP.2021.OMB.StA.2157, retrieved 2026-09-03 —
    # https://www.mires-and-peat.net/article/128842.pdf
    # Table 2 (IMC % / BD g/cm³ / MWC g/g dry mass / MWC % of dry mass):
    # "Sphagnum   16.2 ± 1.1   0.03 ± 0.0304   28.4 ± 2.3***   2,842 ± 224"
    # "Results of mean MWCs (amount of water held within the substrate after
    #  total saturation and drainage) […]"
    bulk_density_g_per_l: 30.0
    irrigation_strategy: moderate

  # ── Plagron Substrates ─────────────────────────────────────────────

  - type: soil
    brand: "Plagron"
    name_de: "Plagron Lightmix"
    name_en: "Plagron Light Mix"
    ph_base: 6.2
    ec_base_ms: 1.2
    water_retention: medium
    air_porosity_percent: 28.0
    composition:
      torf: 0.65
      perlit: 0.15
      fasern: 0.10
      wurmhumus: 0.10
    buffer_capacity: medium
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 48.0
    easily_available_water_percent: 24.0
    cec_meq_per_100cm3: 12.0
    particle_size_mm: 2.5
    bulk_density_g_per_l: 430.0
    irrigation_strategy: moderate

  - type: soil
    brand: "Plagron"
    name_de: "Plagron Growmix"
    name_en: "Plagron Grow Mix"
    ph_base: 6.2
    ec_base_ms: 1.4
    water_retention: medium
    air_porosity_percent: 26.0
    composition:
      torf: 0.55
      perlit: 0.15
      fasern: 0.10
      wurmhumus: 0.20
    buffer_capacity: medium
    reusable: false
    max_reuse_cycles: 1
    water_holding_capacity_percent: 52.0
    easily_available_water_percent: 26.0
    cec_meq_per_100cm3: 15.0
    particle_size_mm: 2.5
    bulk_density_g_per_l: 450.0
    irrigation_strategy: moderate

  - type: soil
    brand: "Plagron"
    name_de: "Plagron Allmix"
    name_en: "Plagron All-Mix"
    # UNCHANGED, and cited because it was doubted. #1152 §D and #1175 reported this
    # `ec_base_ms: 2.5` as sitting above the manufacturer's stated "≈1.6–2.0". It
    # does not: 1.3–2.0 is *Royalmix's* range, which the next record already carries
    # as 1.6. Plagron publishes 2.0–3.0 for Allmix, and 2.5 is its midpoint. pH 6.6
    # likewise sits inside the published 6.1–7.1.
    #
    # Recorded rather than silently left, because a report of a wrong value that is
    # closed with "no change" is indistinguishable from one nobody looked at.
    #
    # Source: Plagron, product page "Allmix", retrieved 2026-09-01 —
    # https://plagron.com/en/hobby/products/plagron-allmix
    # "Characteristics Peat, perlite, worm castings, organic fertilizers.
    #  Prefertilized with 12,5 kg/m³ organic fertilizer (NPK 5.5-11-5.5)
    #  pH: 6.1 - 7.1 (1:1.5) EC: 2.0 - 3.0 mS/cm (1:1.5)"
    ph_base: 6.6
    ec_base_ms: 2.5
    water_retention: high
    air_porosity_percent: 22.0
    # Byte-identical to Royalmix below, and #1152 §D read that as copy-paste. The
    # manufacturer describes BOTH products with the same component list — "Peat,
    # perlite, worm castings, organic fertilizers" — so the identity is the data,
    # not a defect. What actually differs is the pre-fertilisation DOSE: 12.5 kg/m³
    # here against 10.5 kg/m³ in Royalmix, which is why their EC ranges differ.
    #
    # That difference cannot be expressed here, and the reason is the same one that
    # moved lime out of this vector: kg/m³ is a mass dose, and turning 12.5 vs 10.5
    # into two distinct `organischer_duenger` volume fractions needs the
    # fertiliser's bulk density, which Plagron does not publish. So the vectors stay
    # identical rather than being given invented, differing numbers.
    #
    # This is also why the "composition uniqueness per brand" invariant proposed in
    # #1152's table was NOT added: it would fail on correct data.
    composition:
      torf: 0.45
      wurmhumus: 0.25
      perlit: 0.15
      fasern: 0.10
      organischer_duenger: 0.05
    buffer_capacity: high
