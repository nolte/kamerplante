[project]
name = "kamerplanter-backend"
version = "1.0.0"
description = "Kamerplanter agricultural management system backend"
license = "MIT"
requires-python = ">=3.14"
# Every direct dependency carries an upper bound (NFR-009 §2.1). The convention
# is next-major above the currently-locked version: it bounds each dependency
# against surprise breaking releases while keeping all patch/minor updates open
# within the current major (which Renovate's minor/patch group handles). For 0.x
# packages the major boundary is 1.0.0, matching NFR-009's `fastapi<1.0.0` example.
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-arango>=8.1.0,<9.0.0",
    "redis>=5.2.0,<9.0.0",
    "celery>=5.4.0,<6.0.0",
    "structlog>=24.4.0,<27.0.0",
    "httpx>=0.28.0,<1.0.0",
    "markdownify>=0.14.0,<2.0.0",
    "astral>=3.2,<4.0.0",
    "authlib>=1.3.0,<2.0.0",
    "bcrypt>=4.0,<6.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "cryptography>=50,<50.1",
    "python-multipart>=0.0.9,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "croniter>=2.0,<7.0.0",
    "python-dateutil>=2.9,<3.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "jinja2>=3.1,<4.0.0",
    "weasyprint>=70,<71.0.0",
    "qrcode[pil]>=8.0,<9.0.0",
    "zeroconf>=0.131.0,<1.0.0",
    "pywebpush>=2.0.0,<3.0.0",
    "boto3>=1.35,<2.0.0",
    "pillow>=11.0,<13.0.0",
    # REQ-037 — FAO-56 Penman-Monteith / Hargreaves reference evapotranspiration.
    # BSD-3-Clause (a maintained fork of PyETo); verified importable on Python 3.14.
    "aquacropeto>=0.1.1,<1.0.0",
    # #777 — optional error tracking. Always installed so that setting SENTRY_DSN
    # in a deployment is enough to enable reporting; with no DSN the SDK is never
    # initialised and the process is unchanged. The [fastapi] extra pulls the
    # Starlette/FastAPI integration that installs the global exception handler.
    "sentry-sdk[fastapi]>=2.20.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "freezegun>=1.5.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<3.0.0",
    "black>=24.10.0,<27.0.0",
    "moto[s3]>=5.0,<6.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # #978 — opt out of the tests/unit/ and tests/api/ datastore guard
    # (tests/support/db_guard.py). Deliberately the only way out, and it takes a
    # mandatory reason: `grep -rn allow_db_connection tests/` then counts every
    # exception, which a per-test patch never did.
    "allow_db_connection(reason): this test may open a real datastore connection",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.uv]
# The lock toolchain (NFR-009 §2.3). uv replaced pip-tools on 2026-09-10: Renovate's
# pip-compile manager could not parse the lock header this project needs and had
# silently stopped regenerating the locks on 2026-08-02 (#1303/#906 vs. its option
# allowlist), and the pip-tools sidecar could not be held at the pip/click versions
# it survives on (#929, #1296). `uv lock` writes `uv.lock`; `uv sync --locked`
# installs from it with hash verification; Renovate's pep621 manager runs
# `uv lock --upgrade-package` in the same pull request that moves a range here.
# EXACT on purpose: Renovate's pep621 processor resolves the uv it relocks with
# from this value (its `constraints.uv` falls back to it), the Dockerfile copies
# `ghcr.io/astral-sh/uv:<same>` and CI installs `uv==<same>`. A floor would let
# the relocking side move to a newer uv — and a newer lock revision — while the
# reading sides stay pinned, which is the #1296 class (toolchain halves aging
# apart) all over again. renovate.json5 groups all three references into one
# `uv toolchain` pull request. Contributors: `uv self update 0.12.12`, or run
# the Taskfile targets through `uvx --from 'uv==0.12.12' uv …`.
required-version = "==0.12.13"
# Two runtime dependencies ship as sdists only (aquacropeto, http-ece via
# pywebpush), so `uv sync` builds them. Without this their `[build-system]`
# requires would be fetched unpinned at every image build — the floating input
# #1296/#1303 removed with `--no-build-isolation` under pip-tools. Constraining
# the build backend keeps that reproducibility under uv without disabling
# isolation. Aged by the `python build backend` regex rule in renovate.json5.
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
