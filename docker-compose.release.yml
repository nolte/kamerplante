##
## Kamerplanter – Docker Compose (pre-built images)
##
## Quick start:
##   cp .env.example .env        # copy & edit passwords!
##   docker-compose -f docker-compose.release.yml up -d
##
## All credentials are read from .env (not hardcoded here).
## See .env.example for required variables.
##
## Web UI:  http://localhost:8080
## API:     http://localhost:8000/api/v1/docs
##
version: "3.8"

services:
  # ── ArangoDB ──────────────────────────────────────────────
  arangodb:
    image: arangodb:3.12@sha256:39bbca489179ea03f2b24b7ea4e4c4cb5258f6474f8c1c4d9bd65f7cd6d211a5
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Valkey (Redis-compatible) ────────────────────────────
  valkey:
    image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── VectorDB (optional — PostgreSQL + pgvector for AI/RAG) ──
  vectordb:
    build:
      context: ./docker/vectordb
    profiles: ["vectordb"]
    environment:
      POSTGRES_DB: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      POSTGRES_USER: ${VECTORDB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTORDB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (optional — local LLM inference for AI assistant) ──
  ollama:
    image: ollama/ollama:latest@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: ["ollama"]
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── TimescaleDB (optional) ─────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.30.0-pg16@sha256:8adb9b8d8cb56195a1bd66fafb211e57dbc5ea44c0972b7be4dd10b87684bb96
    profiles: ["timescaledb"]
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      POSTGRES_USER: ${TIMESCALEDB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: ${DEBUG}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION}
      KAMERPLANTER_MODE: light
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    volumes:
      - ./spec/knowledge/rag:/app/knowledge:ro
    ports:
      - "8000:8000"
    depends_on:
      - arangodb
      - valkey
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────
  celery-worker:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      KAMERPLANTER_MODE: light
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    volumes:
      - ./spec/knowledge/rag:/app/knowledge:ro
    depends_on:
      - arangodb
      - valkey
    command: celery -A app.tasks worker --loglevel=info
    restart: unless-stopped

  # ── Celery Beat (periodic tasks) ─────────────────────────
  celery-beat:
    image: ghcr.io/nolte/kamerplanter-backend:__VERSION__
    environment:
      ARANGODB_HOST: arangodb
      ARANGODB_PORT: "8529"
      ARANGODB_DATABASE: ${ARANGODB_DATABASE}
      ARANGODB_USERNAME: ${ARANGODB_USERNAME}
      ARANGODB_PASSWORD: ${ARANGODB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      KAMERPLANTER_MODE: light
      TIMESCALEDB_ENABLED: ${TIMESCALEDB_ENABLED:-false}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      TIMESCALEDB_DATABASE: ${TIMESCALEDB_DATABASE:-kamerplanter_sensors}
      TIMESCALEDB_USERNAME: ${TIMESCALEDB_USERNAME:-postgres}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme}
      VECTORDB_ENABLED: ${VECTORDB_ENABLED:-false}
      VECTORDB_HOST: vectordb
      VECTORDB_PORT: "5432"
      VECTORDB_DATABASE: ${VECTORDB_DATABASE:-kamerplanter_vectors}
      VECTORDB_USERNAME: ${VECTORDB_USERNAME:-postgres}
      VECTORDB_PASSWORD: ${VECTORDB_PASSWORD:-changeme}
    depends_on:
      - arangodb
      - valkey
    command: celery -A app.tasks beat --loglevel=info
    restart: unless-stopped

  # ── Frontend (React + nginx) ──────────────────────────────
  frontend:
    image: ghcr.io/nolte/kamerplanter-frontend:__VERSION__
    environment:
      KAMERPLANTER_MODE: light
    ports:
      - "8080:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  arangodb_data:
  valkey_data:
  timescaledb_data:
  vectordb_data:
  ollama_models:
