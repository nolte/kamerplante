  #         globalMounts:
  #           - path: /var/lib/postgresql/data

  # -- VectorDB (optional — PostgreSQL + pgvector for AI/RAG, disabled by default)
  # vectordb:
  #   type: statefulset
  #   replicas: 1
  #   pod:
  #     securityContext:
  #       runAsUser: 999
