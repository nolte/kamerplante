  #             failureThreshold: 5
  #         readiness:
  #           enabled: true
  #           custom: true
  #           spec:
  #             exec:
  #               command: ["pg_isready", "-U", "postgres"]
  #             initialDelaySeconds: 15
  #             periodSeconds: 5
