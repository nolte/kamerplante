# -- IMAGE PINNING INVARIANT (#1025, and #1024 which measured it).
#
# In a RELEASED chart every Kamerplanter ``image.tag`` is
# ``<version>@sha256:<digest>``: the release job rewrites it before packaging
# (scripts/ci/pin_chart_image_digests.sh) and scripts/check_chart_image_digests.py
# proves it did. The digest is what identifies the bytes; the version in front
# of it is only a human-readable label. Together with ``pullPolicy: IfNotPresent``
# that is exact and cheap: the kubelet never re-resolves a tag, because a digest
# cannot move.
#
# In THIS tree the tag is ``latest``. Two things read this tree, and neither
# resolves that tag: Skaffold deploys it into the dev cluster with every owned
# image reference — main containers AND the frontend init container —
# overridden by ``setValueTemplates`` in skaffold.yaml to the locally built
# image; and docker-publish packages it as the ``-dev`` chart, whose OCI tag is
# rewritten by every ``helm/`` merge and which no deployment points at
# (docs/deployment/ci-cd.md, "Zwei Kanäle"). Until 2026-09-10 the develop tree
# carried ``latest@sha256:…`` too, kept current by a Renovate rule; that fed
# nothing and its pull request was rebased by every publish and never merged
# (#1326), so it was removed. A new owned image reference here MUST be added
# to skaffold.yaml's overrides, or the dev cluster pulls ghcr.io's ``latest``
# with ``IfNotPresent`` — the cache trap described below.
#
# **A deployment overlay must NOT add a per-controller ``image.tag`` override.**
# Doing so replaces a digest with a mutable tag, and ``IfNotPresent`` then means
# "keep whatever is already on the node" — measured in #1024: a rollout restart
# silently kept an old image, and the same class had already caught
# inference-service. The failure is invisible from every side except the running
# container.
#
# The division of responsibility that follows from this:
#   * the overlay's ``targetRevision`` selects the chart **version**;
#   * the chart selects the **bytes**.
# An overlay that pins tags takes the second job away from the chart while still
# looking like configuration.
#
# The prod overlay in ``nolte/k8s-home-lab`` still carries such overrides on six
# controllers. That change belongs in that repository; this comment is the
# invariant it has to satisfy, kept next to the values that enforce it here.

# -- NFR-013 Object-storage configuration (§4.1, §10).
#
# This block is the operator-facing source of truth for the storage backend.
# The bjw-s common chart consumes ``controllers``/``persistence`` literally
# (values.yaml is not templated), so the concrete wiring lives there:
#   * ``STORAGE_*`` env vars on the backend + celery-worker controllers
#   * the ``backend-uploads`` PVC mounted at ``storage.localFs.root`` (local-fs)
# Keep this block and that wiring in sync when changing the backend.
#
# SECRETS (NFR-013 §4.1): the S3 access key / secret are NEVER placed in
# values.yaml, a ConfigMap or Git. They are resolved from a Secret produced by
# the External Secrets Operator (``s3.credentialsRef``) and injected via
# ``envFrom`` — see the commented example on the backend controller.
storage:
  backend: local-fs   # local-fs | s3
  maxFileSizeMb: 25
  presignTtlSeconds: 900
  virusScan:
    enabled: false
    endpoint: ""

  localFs:
    root: /data/attachments
    pvc:
      size: 20Gi
      # ReadWriteMany is required once the backend runs with >1 replica AND the
      # celery-worker shares the volume (thumbnail generation). With a single
      # backend replica + single worker on the same node, ReadWriteOnce is fine
      # but limits horizontal scaling — prefer RWX on a CSI that supports it
      # (Longhorn, NFS, CephFS).
      accessMode: ReadWriteOnce
      storageClass: ""   # "" = cluster default StorageClass

  s3:
    endpointUrl: https://s3.eu-central-1.amazonaws.com
    region: eu-central-1
    bucket: kamerplanter-prod
    usePathStyle: false
    forceTls: true
    kmsKeyId: ""
    # External Secrets Operator reference — the operator syncs the upstream
    # secret store into a Kubernetes Secret with these keys. NEVER inline the
    # values here (NFR-013 §4.1).
    credentialsRef:
      secretName: storage-s3-credentials
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# -- Default pod-level security context applied to all controllers (SEC-M-004)
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

# -- Image references (#987)
#
# Every Kamerplanter-owned image below is addressed as `tag: latest` HERE and as
# `tag: <version>@sha256:<digest>` in the released chart — see the invariant at
# the top of this file. READ THE PART AFTER THE `@` in a release: the digest is
# what the kubelet resolves and it is content-addressed, so the reference cannot
# move underneath a running cluster. `latest` is rewritten by every publish, so
# "roll back to the previous image" had nothing to name when the released chart
# still carried it — the documented recovery path was inert in exactly the
# situation it exists for. That is what the release-time rewrite fixes.
#
# Why the digest goes INTO `tag:` and not into the `digest:` field that
# bjw-s/common also offers: pin_chart_image_digests.sh addresses the same
# `repository` + `tag` pair the guard checks, and one field carrying the whole
# reference cannot be half-updated — a tag bumped without its digest would leave
# a cluster silently on the old image, which is the failure renovate.json5
# guards against for the workflow images.
#
# How a new version reaches a cluster:
#   1. docker-publish pushes the images and moves `:latest` in GHCR on every
#      develop merge — nothing deploys from that
#   2. a maintainer publishes a release; the same workflow pins every image here
#      to `<version>@sha256:<digest>` and pushes the chart as that version
#   3. the GitOps repository moves ArgoCD's `targetRevision` to it; pods roll
#      because the pod spec changed
# Rollback is moving `targetRevision` back — the previous chart version carries
# its own immutable digests.
#
# pullPolicy stays `IfNotPresent` deliberately. A digest is content-addressed:
# an image already present on the node IS the requested bytes, so a re-pull can
# only confirm what is there, and `Always` would make every pod start depend on
# GHCR being reachable. The same setting IS a trap with a moving tag — an
# explicit `IfNotPresent` beats the implicit `Always` Kubernetes applies to a
# `:latest` reference, so a node with a cached `latest` keeps serving the old
# image straight through a `rollout restart` (that is how the inference-service
# answered 404 on the pest routes for weeks). Which is why every owned
# reference in this tree, where the tag IS `latest`, is overridden by Skaffold
# and why nothing else deploys it.
controllers:
  backend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      # NOTE: setting pod.securityContext here REPLACES the
      # defaultPodOptions.securityContext (bjw-s does not deep-merge it), so
      # fsGroup MUST be repeated. Without it the backend-attachments PVC mounts
      # as root:root and the uid-1000 process can't write — storage health_check
      # fails and readiness stays 503 (NFR-013).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # How many proxy addresses this deployment's own infrastructure appends
          # to X-Forwarded-For, counted from the right (#1151). Only the backend
          # needs it — the Celery controllers serve no requests.
          #
          # `1` because the chain is client -> ingress -> nginx -> backend, and
          # each of those appends: the ingress records the caller, nginx then
          # appends the ingress's own address, so the caller is the
          # second-to-last entry. Verified against the reference deployment
          # (k8s-home-lab), where the ingress is Contour/Envoy and *both* routes
          # — `/` and `/api` — point at `kamerplanter-frontend:80`, i.e. `/api`
          # is proxied by nginx rather than reaching the backend service直接.
          #
          # A deployment that routes /api straight to the backend Service has one
          # proxy fewer and must set this to 0 — the value follows the request
          # path, not the product name.
          #
          # Not optional decoration. The application default is 0 — the shallow,
          # dev-shaped chain — and leaving it at 0 here would resolve every
          # caller to Traefik's pod IP. The device-pairing lockout buckets on
          # that value (MAX_ATTEMPTS = 5, up to MAX_LOCKOUT_MINUTES = 240), so
          # five wrong codes from one attacker would lock *every* user out of
          # pairing for four hours, and every service account with an
          # `ip_allowlist` would fail closed with 401.
          TRUSTED_PROXY_HOPS: "1"
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8080"]'
          DEBUG: "false"
          # #1236 — the last delivery hop, made measurable. `GET /api/health`
          # discloses `build_revision` (the full 40-character commit the running
          # image was built from) only when this is true; the application default
          # is false, so without this line a deployment cannot be asked what it
          # runs and hop 4 — *does the pod actually serve the bytes the chart
          # pins?* — has no observable at all. That is the hop the 2026-08-17
          # incident failed on, with the hop-3 digest check green and correct.
          #
          # SET HERE, IN THE CHART, ON PURPOSE. #1236's earlier investigation
          # concluded the variable "would need to be set in the GitOps overlay,
          # not in this repository" and stalled on it. That is wrong: production
          # deploys THIS chart (ArgoCD `targetRevision` against
          # `oci://ghcr.io/nolte/charts/kamerplanter`), and Helm merges an
          # operator's `valuesObject` env map INTO this one rather than replacing
          # it. Verified by rendering released chart 0.2.1 with the production
          # Application's own valuesObject: this default and every operator
          # override (KAMERPLANTER_MODE, CORS_ORIGINS, ...) both survive.
          #
          # THE TRADE, STATED PLAINLY. `/api/health` is unauthenticated. The
          # commit hash itself is public — the repository is — but the mapping
          # *this host runs that commit* is not, and it yields the exact patch
          # distance to develop: `git log <revision>..develop` reads off which
          # fixes this instance has NOT got, amplified by this project publishing
          # its own security findings. docs/{de,en}/deployment/ci-cd.md weighs
          # that trade and calls `true` the recommended setting for a production
          # instance whose delivery state should be auditable; this line
          # implements that recommendation as the chart default instead of
          # leaving every deployment to rediscover it.
          #
          # An operator who does not want to disclose overrides this to "false"
          # in their own values — and should then stop running
          # `scripts/ci/check_deployed_build.py` against that instance, which
          # reports "not disclosed" as loud-undetermined, never as clean.
          HEALTH_EXPOSE_BUILD_REVISION: "true"
          MDNS_ENABLED: "false"  # mDNS is LAN-only, disable in K8s
          # REQ-029 Plant identification (Phase 1 — Pl@ntNet-first). All optional:
          # without an API key the feature is disabled and all camera UI is hidden.
          # PLANTNET_API_KEY must be supplied via a Secret (never hard-coded here),
          # e.g. through envFrom/secret injection — see §6.2 of REQ-029.
          IDENTIFICATION_PRIMARY_ADAPTER: "plantnet"
          IDENTIFICATION_CONFIDENCE_AUTO_ACCEPT: "0.85"
          IDENTIFICATION_CONFIDENCE_MIN_SHOW: "0.10"
          IDENTIFICATION_MAX_IMAGE_SIZE_MB: "5"
          # Read timeout (s) for the external /identify call — Pl@ntNet's upload +
          # ML inference can exceed 30s under load (surfaces as ReadTimeout).
          IDENTIFICATION_HTTP_TIMEOUT: "60"
          # Longest edge (px) the image is downscaled to before upload.
          IDENTIFICATION_MAX_IMAGE_DIMENSION: "1024"
          # REQ-033 MCP server — the Streamable-HTTP tool interface for external
          # LLM clients (Claude Code and friends), served in-process by this
          # backend under /api/v1/mcp. Opt-in and OFF by default: while false,
          # every /mcp/* route answers HTTP 404, so the interface is not merely
          # unauthenticated-but-present, it is absent.
          #
          # Turning it on exposes tool calls authenticated by `kp_` API keys —
          # personal ones included — each scoped to its owner's tenant
          # memberships. It needs no extra pod and no extra egress; sessions live
          # in the Valkey instance the backend already uses (REDIS_URL above).
          MCP_SERVER_ENABLED: "false"
          # Replay window for a write tool's idempotency_key (REQ-033 §2.6).
          MCP_IDEMPOTENCY_TTL_HOURS: "24"
          # mcp_audit_log retention; the floor is set by NFR-011, not by taste.
          MCP_AUDIT_RETENTION_DAYS: "90"
          # NFR-013 Object storage (§4.1). Defaults target the local-fs backend
          # whose root MUST match the backend-uploads PVC mount below. Switch to
          # s3 by setting STORAGE_BACKEND=s3 + the STORAGE_S3_* values and adding
          # the credentials via envFrom from the ESO-synced Secret (see comment).
          STORAGE_BACKEND: "local-fs"
          STORAGE_LOCAL_FS_ROOT: /data/attachments
          STORAGE_MAX_FILE_SIZE_MB: "25"
          STORAGE_PRESIGN_TTL_SECONDS: "900"
          STORAGE_VIRUS_SCAN_ENABLED: "false"
          # -- S3 backend (uncomment + set STORAGE_BACKEND=s3 to enable):
          # STORAGE_S3_ENDPOINT_URL: https://s3.eu-central-1.amazonaws.com
          # STORAGE_S3_REGION: eu-central-1
          # STORAGE_S3_BUCKET: kamerplanter-prod
          # STORAGE_S3_USE_PATH_STYLE: "false"
          # STORAGE_S3_FORCE_TLS: "true"
          # STORAGE_S3_KMS_KEY_ID: ""
          # -- S3 credentials come ONLY from the External Secrets Operator —
          # never inline them here (NFR-013 §4.1). Provide a Secret named
          # ``storage-s3-credentials`` (keys STORAGE_S3_ACCESS_KEY_ID /
          # STORAGE_S3_SECRET_ACCESS_KEY) and reference it via envFrom:
          #   envFrom:
          #     - secret: kamerplanter-secrets
          #     - secret: storage-s3-credentials
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/live
                port: &backend-port 8000
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health/ready
                port: *backend-port
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        # Image upload (REQ-034) decodes photos in-memory (Pillow quality
        # assessment); a few-MB JPEG balloons to 100+ MB decoded, so 512Mi
        # OOMKills the pod on upload. 2Gi gives headroom up to the 25 MB max.
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

  frontend:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      init-runtime-config:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            cat <<EOF > /runtime-config/runtime-config.js
            window.__RUNTIME_CONFIG__ = {
              KAMERPLANTER_MODE: "${KAMERPLANTER_MODE:-full}",
              SENTRY_DSN: "${SENTRY_DSN:-}",
              SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}",
              SENTRY_RELEASE: "${SENTRY_RELEASE:-}",
              SENTRY_SAMPLE_RATE: "${SENTRY_SAMPLE_RATE:-}"
            };
            EOF
        env:
          KAMERPLANTER_MODE:
            value: "full"
          # #777 — mirrors the container's own docker-entrypoint.d script. Empty
          # DSN => the browser never fetches the SDK chunk, so the initial
          # payload budget (UI-NFR-003) is untouched when tracking is off.
          SENTRY_DSN:
            value: ""
          SENTRY_ENVIRONMENT:
            value: "production"
          SENTRY_RELEASE:
            value: ""
          SENTRY_SAMPLE_RATE:
            value: "1.0"
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-frontend
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VITE_BACKEND_URL: "http://kamerplanter-backend:8000"
          # #777 — the nginx container needs the DSN too, not just the
          # init container: docker-entrypoint.d/30-error-tracking-csp.sh runs
          # here and widens connect-src by exactly the configured ingest origin.
          # Keep this in step with the init container's value, or the browser
          # loads the SDK and then has its events blocked by the CSP.
          SENTRY_DSN: ""
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &frontend-port 8080
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *frontend-port
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  arangodb:
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: arangodb
          tag: "3.12.11"
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
          - secret: kamerplanter-secrets
        env: {}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8529
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          globalMounts:
            - path: /var/lib/arangodb3

  celery-worker:
    type: deployment
    replicas: 1
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: 0
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # celery-worker mounts the same backend-attachments PVC as backend
        # (thumbnails + DSGVO erasure writes) — fsGroup:1000 required, else the
        # volume mounts root:root and the uid-1000 process can't write.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=2"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          # NFR-013 — the worker generates thumbnails (§8.2) and runs the DSGVO
          # storage erasure (§6.2), so it MUST see the same backend + volume as
          # the backend pod. Keep these in sync with the backend controller.
          STORAGE_BACKEND: "local-fs"
          STORAGE_LOCAL_FS_ROOT: /data/attachments
          STORAGE_MAX_FILE_SIZE_MB: "25"
          # For the s3 backend, add the same STORAGE_S3_* vars + an envFrom on
          # the ESO-synced ``storage-s3-credentials`` Secret (see backend).
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["celery", "-A", "app.tasks", "inspect", "ping", "--timeout", "5"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: false
        # The worker does the same in-memory Pillow image decoding as the
        # backend (thumbnail generation §8.2), so 512Mi OOMKills it under load.
        # Match the backend's 2Gi headroom.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi

  celery-beat:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-backend
          tag: latest
          pullPolicy: IfNotPresent
        command: ["celery"]
        args: ["-A", "app.tasks", "beat", "--loglevel=info", "--schedule=/tmp/celery-beat/celerybeat-schedule"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        envFrom:
          # kamerplanter-secrets also carries INTERNAL_SERVICE_TOKEN (AP-4,
          # INF-S1/S2): the shared M2M secret sent to the knowledge-/inference-
          # service. It arrives automatically via envFrom, so no explicit env
          # entry is needed here.
          - secret: kamerplanter-secrets
        env:
          ARANGODB_HOST: kamerplanter-arangodb
          ARANGODB_PORT: "8529"
          ARANGODB_DATABASE: kamerplanter
          ARANGODB_USERNAME: root
          REDIS_URL: redis://kamerplanter-valkey:6379/0
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["sh", "-c", "test -f /tmp/celery-beat/celerybeat-schedule"]
              initialDelaySeconds: 30
              periodSeconds: 60
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

  # -- VectorDB (REQ-029-A — PostgreSQL + pgvector store for DINOv2 recognition).
  # Disabled by default; the operator enables it (controllers.vectordb.enabled,
  # service.vectordb.enabled, persistence.vectordb-data.enabled,
  # networkpolicies.vectordb.enabled) in the ArgoCD valuesObject together with
  # the inference-service. Modelled on the ``arangodb`` statefulset above.
  vectordb:
    enabled: false
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-vectordb
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          POSTGRES_DB: kamerplanter_vectors
          POSTGRES_USER: postgres
          PGDATA: /var/lib/postgresql/data/pgdata
          # POSTGRES_PASSWORD is NEVER inlined here — the operator sets this one
          # key in ``kamerplanter-secrets``. Pulled by secretKeyRef (scoped to
          # the single key, no envFrom of the whole Secret); the inference
          # service derives its VECTORDB_PASSWORD from the same key.
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pg_isready", "-U", "postgres"]
              initialDelaySeconds: 15
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    statefulset:
      volumeClaimTemplates:
        - name: data
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations:
            helm.sh/resource-policy: keep
          globalMounts:
            - path: /var/lib/postgresql/data

  # -- Inference Service (REQ-029-A — DINOv2 embedding + pgvector match, CPU-only,
  # model baked at build). Disabled by default; the operator enables it together
  # with the vectordb (controllers.inference-service.enabled,
  # service.inference-service.enabled, networkpolicies.inference-service.enabled).
  # INFERENCE_SERVICE_ENABLED on the backend is set in GitOps, not here.
  inference-service:
    enabled: false
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/nolte/kamerplanter-inference-service
          tag: latest
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
          VECTORDB_HOST: kamerplanter-vectordb
          VECTORDB_PORT: "5432"
          VECTORDB_DATABASE: kamerplanter_vectors
          VECTORDB_USERNAME: postgres
          # Single DB-password secret key: the operator sets ONLY
          # ``POSTGRES_PASSWORD`` in ``kamerplanter-secrets`` (PostgreSQL's
          # mandated env name, consumed by the vectordb container). The inference
          # service reads its own ``VECTORDB_PASSWORD`` from that same key via
          # secretKeyRef — never inlined, and scoped to just this one key (no
          # envFrom of the whole Secret).
          VECTORDB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: POSTGRES_PASSWORD
          # AP-4 (INF-S2): shared M2M service token. The backend/celery pods
          # receive the same key via envFrom of kamerplanter-secrets; here it is
          # pulled by scoped secretKeyRef (never inlined). The operator sets
          # INTERNAL_SERVICE_TOKEN once in kamerplanter-secrets (openssl rand
          # -hex 32). Without it the service refuses to start (fail-fast).
          INTERNAL_SERVICE_TOKEN:
            valueFrom:
              secretKeyRef:
                name: kamerplanter-secrets
                key: INTERNAL_SERVICE_TOKEN
          MODEL_PATH: /app/models/dinov2
          # #777 — optional Sentry-protocol error tracking. Empty DSN => the SDK
          # is never initialised and the process is unchanged, so this block is
          # safe to ship enabled-by-absence. Set SENTRY_DSN in the ArgoCD
          # valuesObject (or via kamerplanter-secrets) to switch it on; the DSN
          # carries only a public ingest key, not a credential.
          # SENTRY_ENVIRONMENT must come from the closed vocabulary the alert
          # rules filter on: development | e2e | staging | production.
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: "production"
          # Set to the image tag the deployment rolls out, so a regression is
          # attributable to the release that introduced it.
          SENTRY_RELEASE: ""
          SENTRY_SAMPLE_RATE: "1.0"
          # NetworkPolicy caveat: the external-egress rule below deliberately
          # EXCLUDES the RFC1918 ranges, so a self-hosted tracker on a private
          # address is unreachable until the operator adds an explicit egress
          # rule for it. Events would be dropped silently — the SDK does not
          # surface a blocked connection. Enabling the DSN is therefore two
          # changes, not one.
          MODEL_NAME: dinov2_vits14
          MODEL_DIM: "384"
          INPUT_SIZE: "224"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &inference-port 8000
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: *inference-port
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

  # -- TimescaleDB (optional — disabled by default, enable via values override)
  # timescaledb:
  #   type: statefulset
  #   replicas: 1
  #   pod:
  #     securityContext:
  #       runAsUser: 999
  #       runAsGroup: 999
