repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: check-yaml
        args: ['--allow-multiple-documents', '--unsafe']
        exclude: ^helm/
      - id: check-json
        exclude: ^src/frontend/src/i18n/
      - id: check-merge-conflict

  # ── Crash-recovery guard ───────────────────────────────────────────────
  # Refuses commits from a worktree nested under .claude/worktrees/. Sessions
  # run from there have no resumable top-level transcript, so a crash strands
  # the work (see CLAUDE.md §"Crash recovery"). Use `task worktree:add` instead.
  - repo: local
    hooks:
      - id: guard-nested-worktree
        name: no commits from .claude/worktrees/ (not resumable)
        entry: scripts/guard_nested_worktree.sh
        language: system
        always_run: true
        pass_filenames: false

  # ── Resume-artifact guard ──────────────────────────────────────────────
  # Fails in CI (the required `static` job runs pre-commit) when the branch
  # tip still tracks .resume/ files. Inverse to the guard above: a no-op on
  # local commits so a developer may checkpoint .resume/ into git during work,
  # but it forces the strip before the PR merges to develop. See
  # scripts/guard_resume_files.sh and spec/project/parallel-working-copies/.
  - repo: local
    hooks:
      - id: guard-resume-files
        name: no .resume/ artifacts on the branch (CI-only)
        entry: scripts/guard_resume_files.sh
        language: system
        always_run: true
        pass_filenames: false

  # ── E2E suite (Python) ────────────────────────────────────────────────
  # Deferred in #776 because the tree was red -- the 13 `F841` before-state
  # captures it reported were real findings, not noise, and silencing them to
  # turn the gate green would have destroyed the evidence. They are resolved
  # (#802), so the gate can be armed: `tests/e2e/ruff.toml` is the config that
  # applies here (the backend's pyproject only covers `src/backend`).
  #
  # Both hooks cover the browser-free self-test tier (`tests/e2e_selftest/`) as
  # well since #835, which is why they no longer `cd tests/e2e` and strip that
  # prefix off every filename: that mechanism is bound to a single directory.
  # Handed `tests/e2e_selftest/x.py` it strips nothing -- the prefix there is
  # `tests/e2e_`, not `tests/e2e/` -- and ruff, now resolving the path relative
  # to `tests/e2e/`, aborts with `E902 No such file or directory`. Invoking ruff
  # from the repository root instead is equivalent: it resolves configuration
  # per input file from the closest `ruff.toml` upwards, so `tests/e2e/ruff.toml`
  # and `tests/e2e_selftest/ruff.toml` (which extends it) both still apply,
  # per-file-ignores included. Verified by running the old and the new
  # invocation over the whole tree and comparing.
  - repo: local
    hooks:
      - id: ruff-lint-e2e
        name: ruff check (E2E suite + harness self-tests)
        entry: ruff check --fix
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^tests/(e2e|e2e_selftest)/.*\.py$
        types: [python]
      - id: ruff-format-e2e
        name: ruff format (E2E suite + harness self-tests)
        entry: ruff format
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^tests/(e2e|e2e_selftest)/.*\.py$
        types: [python]

  # ── E2E harness self-tests (#835) ─────────────────────────────────────
  # `tests/e2e_selftest/` hung off no gate at all until this hook: the ruff
  # filters above read `^tests/e2e/.*\.py$`, which does not match it, and no
  # workflow calls `task test:e2e:selftest`. Its 58 browser-free tests ran on a
  # developer's machine and nowhere else.
  #
  # That is the one tier that must not stay ungated. Sixteen of those tests pin
  # `tests/e2e/pages/_element_proxy.py`, whose re-resolving element reference
  # reads Selenium internals that are not public API (`WebElement._execute`, the
  # private `_id`, `WebDriver._wrap_value`'s element-detection contract). The
  # suite pins `selenium>=4.25.0,<5`, so Renovate will keep proposing minors that
  # are free to move any of them; ungated, such a break is silent, and a silent
  # break there costs every browser test its stale-element healing.
  #
  # `language: python`, not `language: system`: the required `static` job runs
  # this config on a bare ubuntu-latest + setup-python runner with none of the
  # project's dependencies installed, so a system-python entry would die on
  # `import selenium`. The isolated env pins what `tests/e2e/requirements.txt`
  # pins -- a hook that installed a different Selenium would be verifying the
  # proxy against a version the suite never runs on.
  #
  # `python -m pytest`, not the `pytest` console script: the tests import their
  # subject as `tests.e2e.pages...`, and `-m` puts the working directory (the
  # repository root, where pre-commit runs every hook) on `sys.path`.
  #
  # `language_version` is pinned because the subject needs 3.14: the page objects
  # use PEP 758 (`except A, B:` without parentheses) in seven places, a
  # SyntaxError on 3.13 and older. Cited by construct rather than by `file:line`
  # -- the line this used to name moved when #835 P4 rewrote the row helpers, and
  # a stale citation reads as a premise that no longer holds. Enumerate them with
  # `grep -rnE '^\s*except\s+[^(\s][^:]*,' tests/` (the `[^:]*` is what keeps an
  # `except X as e:` with a comma in its trailing comment out of the count).
  # Unpinned, pre-commit builds the env with the
  # interpreter *it* runs on, which on a developer machine is often the distro
  # python -- this hook collapsed with that SyntaxError on 3.12 before the pin.
  # The CI runner is CPython 3.14.6 (setup-python `3.x`), so `python3.14` is on
  # PATH there; should that default ever move past 3.14, this hook fails loudly
  # at env creation and the pin is a one-line bump.
  #
  # ~17 s wall clock, most of it real waits the timeout tests cannot fake. The
  # `files:` filter keeps that off local commits touching neither the tier nor
  # its subjects; in CI `pre-commit/action` runs `--all-files`, so the filter
  # always matches there and the cost is paid once per push, not per PR path.
  - repo: local
    hooks:
      - id: e2e-selftest
        name: E2E harness self-tests (browser-free, #835)
        entry: python -m pytest tests/e2e_selftest -q -p no:cacheprovider
        language: python
        language_version: python3.14
        additional_dependencies: ['selenium>=4.25.0,<5', 'pytest>=8.3.0']
        # `e2e/.*\.py` and not just `e2e/pages/`: the selftests now also read the
        # scenario modules (see test_set_returning_helper_comparisons.py), and a
        # guard the hook never runs on the files it inspects is decoration.
        files: ^tests/(e2e_selftest/|e2e/.*\.py$|e2e/requirements\.txt$)
        pass_filenames: false

  # ── Spec-to-test traceability ─────────────────────────────────────────
  # Runs in the required `static` job, which is the whole point: until #775 the
  # classic suite's docstring TC-IDs were verified by nothing, so 616 of them
  # had drifted into a per-file running count that only coincidentally hit a
  # real spec number — and nobody noticed, because no gate looked.
  #
  # Both channels are checked: the Gherkin `@TC-…` tags and the classic
  # docstrings. #775 left the 99 mechanically-unresolvable docstrings behind two
  # shrink-only baselines, so the check could be green while the debt stayed
  # visible. #839 paid that debt off — 66 of the 99 needed a test case *written*,
  # three requirements had no test-case document at all — and removed both
  # baselines. An untagged test and an unresolvable ID are plain defects now.
  #
  # Standard library only, no stack, no browser — cheap enough for every commit.
  - repo: local
    hooks:
      - id: e2e-traceability
        name: E2E spec-to-test traceability (#775)
        entry: python3 scripts/check_bdd_traceability.py
        language: system
        files: ^(tests/e2e/|spec/e2e-testcases/|scripts/check_bdd_traceability\.py)
        pass_filenames: false

  # ── API schema examples (#850) ────────────────────────────────────────
  # BACKEND.md §5.3 asks every *new or changed* request/response schema for an
  # OpenAPI example and explicitly does not retro-fit the existing stock. A rule
  # shaped like that cannot be checked as "does every model have an example?" —
  # it is checked by counting the models that have none and refusing growth above
  # a recorded ceiling. The current count is whatever the hook prints; no number
  # is repeated here, because a repeated number goes stale silently (this comment
  # said "the existing 711" for a month after the count had reached 704).
  #
  # The ceiling is deliberately NOT lowered per pull request (#973): doing so put
  # every example-adding change on the same line of the same file and made two
  # concurrent ones conflict on an integer carrying no review value.
  #
  # Runs here, in the required `static` gate: standard library only, no Pydantic
  # import, no node_modules, no running stack — ~0.2 s over 72 modules.
  #
  # always_run rather than a `files:` filter on purpose. pre-commit hands a hook
  # only added/modified files, so a commit that *deletes* a schema module would
  # not trigger a path-filtered hook — and a deletion moves the count exactly as
  # much as an addition does. At this cost there is no reason to look away.
  - repo: local
    hooks:
      - id: schema-example-ratchet
        name: API schema examples (no-growth ratchet, #850)
        entry: python3 scripts/check_schema_examples.py
        language: system
        always_run: true
        pass_filenames: false

  # ── Seeded catalogue vs. list-view page size (#995) ────────────────────
  # Refuses a reference catalogue that has more seeded rows than its list view
  # fetches. `DataTable` searches, sorts and paginates client-side, so a bounded
  # first request does not paginate — it drops the rest of the catalogue and then
  # answers "no results" when a user searches for one of the dropped rows. Seven
  # botanical families and one activity were unreachable that way when #995 was
  # filed, and it was reported as a *search* defect two milestones later.
  #
  # No test can catch this. The two numbers that must not cross are YAML under
  # src/backend and TypeScript under src/frontend; no unit test on either side
  # sees both, and an end-to-end test would need a database seeded to the exact
  # size that trips it — which is precisely the state nobody notices.
  #
  # Both numbers are derived from the tree: the row count from the seed YAML, the
  # loaded-file set from the seeders' own `.yaml` literals, the fetch contract
  # from the frontend slice. So this hook carries no hand-edited count, and two
  # concurrent pull requests adding seed rows do not conflict on it — the failure
  # mode #973 closed for the ratchet hooks below.
  #
  # Runs here, in the required `static` gate: stdlib plus PyYAML, no application
  # import, no node_modules, no running stack — ~0.4 s over 37 seed files.
  # `language: python` with an explicit PyYAML pin rather than `system`, matching
  # the Steckbrief consistency hook further down: both read seed YAML, and the
  # isolated pre-commit venv has no site-packages to inherit it from.
  #
  # always_run rather than a `files:` filter, for the reason the hooks below give:
  # pre-commit hands a path-filtered hook only added/modified files, and a commit
  # that *deletes* a seed file moves the count exactly as much as one that adds
  # rows. Also asserted from
  # src/backend/tests/unit/test_seed_catalogue_page_size_check.py, so a
  # backend-only change goes red in the backend suite too, not only here.
  - repo: local
    hooks:
      - id: seed-catalogue-page-size
        name: seeded catalogues fit the page their list view fetches (#995)
        entry: python scripts/check_seed_catalogue_page_size.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Boundary validation (#970) ─────────────────────────────────────────
  # Refuses a request schema that accepts input its domain model rejects — the
  # shape that answers HTTP 500 where 422 is the truthful answer, because a
  # `pydantic.ValidationError` raised while constructing a domain model is not
  # FastAPI's `RequestValidationError` and matches neither validation handler.
  #
  # BACKEND.md §5.4 decided this class is handled *per endpoint*, at the
  # boundary, and explicitly not by a global handler: the same exception means
  # "the caller sent something invalid" (422) or "we assembled the model
  # wrongly" (500, and it must reach error tracking). #966 was the second kind
  # and stood for 274 days; a blanket 422 would have hidden it further.
  #
  # A per-endpoint rule needs something that catches the endpoint that forgets
  # it, and this hook is that. It reports only what is certain from annotations
  # alone — an enum widened to `str`, a nullable forwarded over a non-nullable
  # domain field. The cross-field-validator shape #970 reported is deliberately
  # out of scope: 32 pairings carry one, most of them fine, and a check with
  # false positives gets suppressed within a week.
  #
  # Scope, structurally: it pairs on *construction sites*
  # (`DomainModel(**body.model_dump())`), so a router that writes a dict straight
  # to a collection instead of constructing the model has no site here and is
  # invisible to it (#1020, the #997 shape). That dict-writer class is owned by
  # the API→data-access layer gate below (check_layer_imports, NFR-001), which
  # refuses the `app.data_access` import such a write needs — not by this hook.
  #
  # Two enforcement modes in one script, matching the two debts. The enum shape
  # has 54 existing occurrences, so it carries a shrink-only ceiling like the
  # schema-example hook above; per #973 a *drop* is informational, never red, so
  # no concurrent pull request has to edit a constant to merge. The nullable
  # shape has none left after #967, so it is a plain defect with no baseline —
  # the same argument `check_utc_calendar_day.py` makes for refusing a ratchet
  # pinned at zero.
  #
  # Runs here, in the required `static` gate: standard library only, no Pydantic
  # import, no running stack. ~3 s over the 900 modules of src/backend/app —
  # more than the schema-example counter costs, because resolving a base class
  # or an enum through a module's own import table means the whole package has
  # to be parsed, not only the schema files. Also asserted from
  # tests/unit/test_boundary_validation_check.py, so a backend-only change goes
  # red in the backend suite too, not only here.
  #
  # always_run for the same reason as the hook above: deleting a schema moves
  # the count exactly as much as adding one, and a path-filtered hook never sees
  # a deletion.
  - repo: local
    hooks:
      - id: boundary-validation
        name: request schemas reject what the domain rejects at construction sites (#970)
        entry: python3 scripts/check_boundary_validation.py
        language: system
        always_run: true
        pass_filenames: false

  # ── Seed harvest & month integrity (#1002, #1008) ──────────────────────
  # Refuses a seed species record that asserts a harvest or sowing fact no
  # consumer can act on. Two invariants, one family:
  #
  #   A  `allows_harvest` effectively true with no `harvest_months` anywhere.
  #      The flag makes every pre-harvest safety interval (Karenz) a question
  #      that must be answered, and the record supplies no date to answer it
  #      with — so the check is not "not applicable", it is undecidable. A
  #      conservative consumer then refuses the whole biological-spray tier on a
  #      plant nobody eats; an optimistic one clears a treatment it cannot clear,
  #      which on a plant that *is* harvested is a food-safety error.
  #   B  flat top-level month fields that are not the union of the record's
  #      `growing_periods`. `get_sowing_calendar` reads the periods and
  #      `get_species_info` the flat fields, so a disagreement means the answer
  #      depends on which endpoint the caller happened to use. On Allium porrum
  #      the flat fields omitted the winter crop's entire sowing window.
  #
  # Invariant A is evaluated on the *effective* value, because
  # `Species.allows_harvest` defaults to True: 43 of the 44 records this found
  # carried no `allows_harvest` key at all, and a literal reading of the YAML
  # would have found one. That duplicated default is pinned by
  # tests/unit/test_seed_harvest_integrity_check.py, so flipping the model
  # without flipping the script goes red in the backend suite.
  #
  # No numeric baseline. Both invariants are booleans — a record either supplies
  # a harvest date or it does not — and #973 recorded what a hand-maintained
  # count costs besides: every concurrent pull request that moves it edits the
  # same line of the same file. The debt is paid off in the same change that
  # armed this, so a ratchet here would be dead machinery.
  #
  # always_run rather than a `files:` filter, for the reason the two hooks above
  # give: the merged view of a species spans several seed files, so a change in
  # one can break an invariant whose other half lives in a file the commit does
  # not touch. Standard library plus PyYAML, ~0.3 s over the 207 records.
  - repo: local
    hooks:
      - id: seed-harvest-integrity
        name: seed harvest & month facts are consumable (#1002, #1008)
        entry: python scripts/check_seed_harvest_integrity.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── UTC calendar day (#858) ────────────────────────────────────────────
  # Refuses a bare `date.today()` — the *local server* date — anywhere under
  # src/backend/app. BACKEND.md §12a has required UTC there since #812, but
  # nothing measured it, so the sweep had to be repeated three times (#772,
  # #812, #858) and 18 call sites survived the second one.
  #
  # This defect cannot be caught by any test on CI: on a UTC container
  # `date.today()` and `datetime.now(UTC).date()` return the same value, so the
  # mistake reads as correct in review, in local development on a UTC box, and
  # in every CI run. Only a static gate sees it there — which is why this hook
  # exists rather than a test.
  #
  # Zero allowed, not a recorded ceiling like the schema-example check above:
  # that one carries debt that cannot be paid off in one change, this one has
  # none left. (The traceability check above held baselines too until #839
  # cleared its debt and dropped them — a baseline is a holding position, and
  # leaving one pinned at zero would be dead mechanism dressed as policy.)
  # The escape hatch is per-site (`# local-clock: <reason>`) and therefore more
  # informative than a number — a reviewer can argue with a reason.
  #
  # Standard library only, no application import, no stack. pass_filenames is
  # false so a converted site cannot hide behind an unrelated commit's file set.
  - repo: local
    hooks:
      - id: utc-calendar-day
        name: no bare date.today() in the backend + side-service app code (#858, #1058)
        entry: python3 scripts/check_utc_calendar_day.py
        # pass_filenames is false, so the entry scans its own DEFAULT_SCAN_ROOTS
        # (backend + the three side-service app dirs) regardless of what changed.
        # This `files:` set only decides WHEN the hook fires — widened in #1058 so
        # an edit to a side-service app file triggers the now-in-scope scan, not
        # only a backend or script edit.
        language: system
        files: ^(src/backend/app/.*\.py|src/knowledge-service/app/.*\.py|src/inference-service/app/.*\.py|src/libs/kp_vectordb/kp_vectordb/.*\.py|scripts/check_utc_calendar_day\.py)$
        pass_filenames: false

  # ── Tenant key in a request body (P1.2) ────────────────────────────────
  # Refuses a `tenant_key` / `tenant_slug` field on a REQUEST schema under
  # src/backend/app/api. The tenant of a write is decided by the authenticated
  # context, never by the caller — a body that carries it lets an authenticated
  # user name somebody else's tenant, which is #1000 exactly, and eighteen of
  # the last two hundred issues sit in that cluster.
  #
  # A gate rather than a review item because the defect is invisible in the diff
  # that introduces it: the field reads as plumbing, and the damage appears one
  # layer down in a service that trusts it. Every one of those eighteen issues
  # was found afterwards, by somebody reading a different file.
  #
  # Response schemas are NOT touched — fourteen of them legitimately report the
  # tenant a record belongs to. The request set is derived from what routers
  # actually bind as a body (plus the Create/Update/Request naming convention,
  # so a schema written before its router is covered), not guessed from a name.
  #
  # No numeric baseline: the two occurrences in the tree both carry a per-site
  # `# tenant-body-ok: <reason>` marker naming why, which is strictly more
  # informative than a count a reviewer cannot argue with. Standard library
  # only, no application import, ~1 s over the API tree. Also asserted from
  # tests/unit/test_tenant_body_field_check.py.
  #
  # pass_filenames is false so a converted schema cannot hide behind an
  # unrelated commit's file set.
  - repo: local
    hooks:
      - id: tenant-body-field
        name: no caller-supplied tenant_key in a request body (#1000)
        entry: python3 scripts/check_tenant_body_field.py
        language: system
        files: ^(src/backend/app/api/.*\.py|scripts/check_tenant_body_field\.py)$
        pass_filenames: false

  # ── API → data-access layer boundary (P1.3) ────────────────────────────
  # Refuses a NEW `app.data_access` import under src/backend/app/api. NFR-001's
  # layer order says a router reaches persistence through a service; when it
  # reaches around, the tenant predicate that the service anchors on the parent
  # entity is gone with it. Cluster B of the 2026-08-08 issue-pattern audit is
  # seven issues of that (#1020, #1019, #1018, #997, #991, #968, #456), and the
  # audit found no import-linter, no ruff TID rule — nothing measuring it.
  #
  # The 22 existing crossings are an ALLOWLIST inside the script, not a count.
  # A count would let a reviewer clear an easy one while a hard new one lands in
  # the same pull request; every entry here names the file, the module and what
  # would remove it. An entry matching no import is an ERROR, the same rule
  # seed_steckbrief_consistency.ALLOWED_DISCREPANCIES carries: a stale entry
  # silently re-permits the import the moment somebody adds it back.
  #
  # always_run rather than a `files:` filter: DELETING the last import of an
  # allowlisted module moves the answer exactly as much as adding one, and a
  # path-filtered hook never sees a deletion.
  - repo: local
    hooks:
      - id: layer-imports
        name: the API layer does not import data_access (NFR-001)
        entry: python3 scripts/check_layer_imports.py
        language: system
        always_run: true
        pass_filenames: false

  # ── Route role-guard decisions (#1261, REQ-049 §2.3) ───────────────────
  # The router had no role guard at all: after #1260 gated `POST /identify` at
  # grower, a viewer could still open /pflanzen/identifikation, work through the
  # whole wizard and collect a 403 on the last step. Adding the wrapper to that
  # one route would have reproduced the defect one level up — a guard applied to
  # the routes somebody happened to look at is exactly #948, where two of four
  # sibling routes were repaired and the other two stayed open for months.
  #
  # So the hook does not check "are the guarded routes guarded". It checks that
  # EVERY route in AppRoutes.tsx carries a recorded decision in
  # roleGuardedRoutes.ts — guarded, gated inside the page, or nothing to gate —
  # and that the <RequireRole> wrappers and the table agree in BOTH directions.
  # A missing wrapper is the bug returning; a wrapper the table does not back is
  # a guard stricter than the API, which removes read access the API grants.
  #
  # `language: system` (stdlib only, no YAML) and always_run: deleting a route
  # moves the answer exactly as much as adding one, and a path-filtered hook
  # never sees a deletion.
  #
  # What it deliberately does NOT do: verify a decision is right. That needs the
  # route x backend-gate join, which needs the backend importable — see the
  # script's docstring.
  - repo: local
    hooks:
      - id: route-role-guards
        name: every frontend route carries a role-guard decision (#1261)
        entry: python3 scripts/check_route_role_guards.py
        language: system
        always_run: true
        pass_filenames: false

  # ── Workflow gate integrity (P5.4, NFR-018 §2) ─────────────────────────
  # NFR-018 says a check that cannot report a failure must not exist, and §8
  # admits the spec has no gate of its own — "die unangenehme Pointe". This is
  # that gate: `|| true` in a run step, `continue-on-error: true`, and a job
  # that reads `needs.<x>.outputs` under `always()` without consulting
  # `needs.<x>.result` (a failed producer then leaves every output empty, every
  # step skipped, and a job whose steps are all skipped reports SUCCESS — the
  # trap frontend.yml documents twice).
  #
  # Every shape here is legitimate somewhere: `grep -c` exits 1 on a zero count,
  # and a JUnit reporter must not turn a suite red because a fork's token cannot
  # create a check run. So it is a per-site `# gate-integrity-ok: <reason>`
  # marker rather than a ban — the 19 sites in the tree carry one, and eight of
  # them say "needs follow-up" instead of pretending to be settled.
  #
  # `language: python` with PyYAML: the
  # required `static` job runs on a bare runner with none of the project's
  # dependencies installed. always_run, because deleting a workflow moves the
  # answer as much as editing one.
  #
  # Since #1313 the same hook also refuses a gate that cannot RUN on the change
  # that breaks it: a workflow reading a file its own `paths:` filter excludes.
  # Same script on purpose — a second thin checker for one rule would duplicate
  # the discovery, the escape hatch and this wiring and then drift from them,
  # which is recursively the defect #1313 is about.
  - repo: local
    hooks:
      - id: workflow-gate-integrity
        name: no CI gate that cannot fail, or cannot run on the change (NFR-018 §2, #1313)
        entry: python3 scripts/check_workflow_gate_integrity.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Workflow + shell linting (#1295) ───────────────────────────────────
  # Three workflows already *reasoned about* shellcheck in their comments —
  # `e2e-smoke.yml:191`, `e2e-nightly.yml:106`,
  # `security-nuclei-nightly.yml:181` — while neither shellcheck nor
  # actionlint ran anywhere in this repository. That belief is how #1010
  # survived a required lane for three weeks: a `#` on a backslash-continued
  # line ended the logical `nuclei` command, `-tags`, `-severity`, `-o` and
  # `-sarif-export` were dropped with it, and the nightly scan reported green
  # for 22 consecutive nights while writing none of the artefacts the steps
  # downstream gate on.
  #
  # BLOCKING from day one, not advisory. NFR-018 §4 wants promotion to
  # blocking to be a measured decision, and what was measured is that there
  # is nothing to promote *through*: actionlint over every file under
  # `.github/workflows/` is silent, and shellcheck at `--severity=warning`
  # over the 21 own `*.sh` is silent once the three findings cleared in the
  # first half of this change (SC2034 in `dev-teardown.sh`, SC2155 in
  # `run-e2e.sh`, and SC2088 in `worktree_add.sh` — that last one a false
  # positive, suppressed with its reason). An advisory phase exists to work a
  # backlog down; with no backlog it is only a window in which the gate
  # cannot report, which is the shape NFR-018 §2 forbids outright.
  #
  # `language: docker_image` — upstream's `actionlint-docker` id, not
  # `actionlint`. R3 asks that BOTH tools be pinned, and only this form
  # delivers that: `language: golang` builds actionlint at the `rev` and then
  # takes shellcheck from the runner's PATH, so half the gate would be
  # whatever `ubuntu-latest` happens to ship that week — precisely the
  # unpinned exposure R3 exists to close. `language: system` pins nothing at
  # all. The docker form pins both, because the upstream
  # `.pre-commit-hooks.yaml` at each tag carries a literal
  # `docker.io/rhysd/actionlint:1.7.12` /
  # `docker.io/koalaman/shellcheck:v0.11.0` entry and never `latest`: the
  # `rev:` below *is* the tool version, and Renovate's pre-commit manager
  # owns the bumps (it already does — #1079 bumped check-jsonschema below).
  # Residual, accepted: a `rev` binds an image TAG, not a digest.
  #
  # Consequence worth stating, because these are the repository's FIRST
  # `docker_image` hooks (measured: there were none): a local commit that
  # touches a workflow or a `*.sh` now needs a running Docker daemon. Docker
  # is already a precondition for `task dev` and the E2E suite, and the
  # upstream `files:`/`types:` filters keep the cost off every other commit —
  # but it is new. ~0.9 s per hook over the whole tree with a warm image; the
  # cold pull in the `static` lane is not measured here.
  #
  # One container-specific trap, for whoever re-wires this outside pre-commit:
  # actionlint needs a `.git` MARKER in the mounted tree. Measured against
  # 1.7.12 — a mount with no `.git` at all exits **3** with "no project was
  # found", having checked nothing, which is a silent-green shape if the exit
  # code is ever swallowed. A `.git` *file* whose gitdir points outside the
  # container (i.e. a `task worktree:add` working copy, where that path does
  # not exist in the mount) is enough and checks normally — verified on the
  # #1010 form, so the `Passed` above is a real pass and not that trap.
  #
  # THE TWO HALVES DO NOT SHARE A THRESHOLD, and that asymmetry is not an
  # oversight to be tidied away. actionlint's bundled shellcheck runs at
  # shellcheck's own default floor and exits 1 on `info`, while the `*.sh`
  # hook is floored at `warning` (A2 of the requirement artifact: nothing was
  # measured about the `info`/`style` band, so lowering that floor is a
  # separate, additive decision). Measured on one construct: `sort f > f` is
  # `SC2094:info` — red through actionlint, silent through the `*.sh` hook at
  # `--severity=warning`. Harmless today, since both halves sit at zero, but
  # a future `info`-level rule will redden the workflow half and not the
  # script half, and a reader who assumes symmetry will misdiagnose it.
  #
  # No `exclude:` for `src/backend/.venv/**` or `**/node_modules/**`, even
  # though the requirement names them out of scope: `pre-commit --all-files`
  # works over the git INDEX, and no indexed path lies under either, so an
  # `exclude:` here would be dead configuration reading as a live rule. The
  # flip side belongs here too — the exclusion is a consequence of those
  # trees being unindexed, so a later glob-driven `task` variant would NOT
  # inherit it and would have to state it. Measured for the same reason:
  # upstream's `types: [shell]` selects exactly the 21 own `*.sh` and nothing
  # else, because no extensionless indexed file carries a shell shebang.
  #
  # This does NOT retire `scan_continuations` in
  # `scripts/check_workflow_gate_integrity.py`, and #1295's own claim that it
  # "overlaps SC2215" is incomplete. Measured against the bundled shellcheck
  # 0.11.0 on three `run:` blocks differing only in the line after the `#`:
  # a flag gives `SC2215`, an argument to a command whose arity shellcheck
  # knows gives `SC2225`, and a bare positional to a command it does not know
  # gives NOTHING. That third case is why both checks stay; the measured
  # division of labour is recorded in that function's docstring rather than
  # only here, because the next reader meets the code first.
  #
  # `name:` is overridden for actionlint, whose upstream name says nothing
  # about the shellcheck integration that does most of the work here — and
  # deliberately NOT for shellcheck: upstream regenerates `ShellCheck
  # v0.11.0` from the tag at every release, so that name tracks `rev:` by
  # itself, whereas a hand-written copy would go stale the first time
  # Renovate bumps the pin.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
        name: actionlint + bundled shellcheck over .github/workflows/ (#1295)

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # ── Attestation registry credentials (#1218) ───────────────────────────
  # `actions/attest-build-provenance` with `push-to-registry: true` reads exactly
  # one credential file — `~/.docker/config.json`, in its bundled
  # `getRegistryCredentials`. `publish-helm-charts` logged in with
  # `helm registry login`, which writes Helm's OWN store, so every run since
  # 2026-08-01 died with `No credentials found for registry ghcr.io`. Two
  # published releases (v0.1.0, v0.2.0) lost their chart .tgz, their compose
  # file, their env example and the release body's Packages block — the failing
  # job took `update-release-assets` down with it. Seventeen days, nobody noticed.
  #
  # Nothing in the YAML expressed that coupling: eight image jobs with
  # `docker/login-action` and one chart job with `helm registry login` looked
  # interchangeable. This hook expresses it, and turns a failure that only
  # surfaced at release time into one a pull request shows.
  #
  # Two logins to the same registry in one job is the CORRECT end state here
  # (`helm push` reads Helm's store, the attest action reads Docker's), which is
  # exactly why it needs a gate: it looks redundant and is not.
  #
  # `# attest-credentials-ok: <reason>` per site rather than a ban — a job may
  # legitimately get its Docker credentials some other way, and then it says so.
  #
  # `language: python` with PyYAML, like the gate-integrity hook above: the
  # required `static` job runs on a bare runner with none of the project's
  # dependencies installed. always_run, because deleting a login moves the
  # answer as much as editing one.
  - repo: local
    hooks:
      - id: attest-registry-credentials
        name: an attesting job carries a Docker-store login (#1218)
        entry: python3 scripts/check_attest_registry_credentials.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Chart version on the develop channel (#1222) ───────────────────────
  # `helm push` derives the OCI tag from the chart version, and
  # docker-publish.yml's `Update chart version for release` step is gated on a
  # tag ref — so whatever `helm/*/Chart.yaml` commits is exactly what every
  # `helm/**` merge to develop publishes. The tree carried `version: 0.2.0`,
  # which is a PUBLISHED RELEASE, so on 2026-08-18 a develop merge republished
  # charts/kamerplanter:0.2.0 — `created: 2026-08-18T14:09:14Z` against a release
  # published 2026-08-13T18:09:49Z, five days earlier. Different bytes under an
  # existing version reference, which spec/project/continuous-delivery/en.md
  # prohibits outright.
  #
  # Nothing in the repository could observe that: you had to pull the OCI tag and
  # diff it. This hook makes it visible in the diff instead.
  #
  # The rule is deliberately WEAKER than "must not equal a published release
  # version". That stronger rule needs the published set, and every way of
  # getting it makes the guard inert where it matters: a live API call ties the
  # required lane to network reachability; deriving it from git tags is green
  # locally (26 tags) and inert in CI (the static lane checks out shallow with
  # none), and a DRAFT release has no tag at all. So: parse as SemVer 2.0 and
  # carry a pre-release whose first identifier is exactly `dev`. Its premise —
  # that no release tag carries a `dev` pre-release — is enforced on the release
  # side by scripts/ci/determine_chart_version.sh, not assumed here.
  #
  # `# chart-develop-version-ok: <reason>` per chart rather than a ban — a chart
  # that is never published from develop can say so.
  #
  # `language: python` with PyYAML, like the two hooks above: the required
  # `static` job runs on a bare runner with none of the project's dependencies
  # installed. always_run, because deleting a chart moves the answer as much as
  # editing one, and because the checker errors rather than passing when it finds
  # no chart at all.
  - repo: local
    hooks:
      - id: chart-develop-version
        name: the develop tree's chart version is a -dev pre-release (#1222)
        entry: python3 scripts/check_chart_develop_version.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Seed YAML ↔ JSON Schema (P3.3) ─────────────────────────────────────
  # The seed files carry a `# yaml-language-server: $schema=…` directive and 31
  # of them declare one, but only ~12 were ever validated: the backend test
  # (tests/unit/migrations/test_seed_schema_conformance.py) globs
  # `plant_info*.yaml` + four named files, which is how `adventskalender.yaml`
  # — a plant_info document by declaration — fell through for its whole life.
  # And that suite does not run at all on a change that touches only seed data
  # until backend.yml's `paths:` says so (fixed in the same change as this).
  #
  # `--base-uri file://./…/schemas/` is load-bearing, not decoration. Every
  # schema declares a BARE `$id` (`species.schema.yaml`), so a relative
  # cross-file `$ref` — `_defs.schema.yaml#/$defs/phase_name`, used by four
  # schemas — resolves against the process's working directory and dies with
  # `Unretrievable: '_defs.schema.yaml'`. A relative `--base-uri` without the
  # `file://` scheme is ignored; with it, resolution happens relative to the
  # repository root, which is where pre-commit runs every hook.
  #
  # ─ WHAT IS DELIBERATELY NOT VALIDATED HERE ─
  # Measured 2026-08-08: 19 of the 31 declared files validate clean, 12 do not.
  # They are left out BY NAME rather than by a loose glob (NFR-018: a named
  # omission, never a silent hole), and they are not repaired here because seed
  # data corrections are in flight in PR #1034 and fixing them from this lane
  # would collide. Every one of them is schema-behind-data drift — a property
  # the loader accepts that the schema never learned — not corrupt data:
  #
  #   activities.yaml            22 errors  restricted_sub_phases + 4 enum values
  #   adventskalender.yaml      523 errors  growth_phases entries lack name/sequence_order
  #   botanical_families.yaml     2 errors  nitrogen_fixing, rotation_edges
  #   companion_planting.yaml     1 error   family_compatible / family_incompatible
  #   fertilizers.yaml          129 errors  shelf_life_days, storage_temp_min/max
  #   gardol.yaml                71 errors  nutrient-plan method_type/method_params
  #   harvest_indicators.yaml     1 error   indicator_type 'days_since_sowing'
  #   nutrient_plans_hydro.yaml 362 errors  product_name vs fertilizer_product_name
  #   nutrient_plans_outdoor.yaml 267 errors  same rename
  #   nutrient_plans_ro.yaml     92 errors  same rename
  #   plagron.yaml              182 errors  same rename
  #   workflows.yaml             31 errors  task_templates.phase_name
  #
  # FOLLOW-UP: each line above is one schema amendment (or one seed correction)
  # away from being deletable. Move a file out of this list by adding it to the
  # matching hook's `files:` pattern in the same change that makes it validate.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-jsonschema
        name: seed schema — auth.yaml
        files: ^src/backend/app/migrations/seed_data/auth\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/auth.schema.yaml
      - id: check-jsonschema
        name: seed schema — fertilizers_supplement.yaml
        # fertilizers.yaml, gardol.yaml, plagron.yaml and the three
        # nutrient_plans_*.yaml declare the same schema and do not validate yet.
        files: ^src/backend/app/migrations/seed_data/fertilizers_supplement\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/fertilizers.schema.yaml
      - id: check-jsonschema
        name: seed schema — ipm.yaml
        files: ^src/backend/app/migrations/seed_data/ipm\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/ipm.schema.yaml
      - id: check-jsonschema
        name: seed schema — lifecycles_outdoor.yaml
        files: ^src/backend/app/migrations/seed_data/lifecycles_outdoor\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/lifecycles.schema.yaml
      - id: check-jsonschema
        name: seed schema — light_mode.yaml
        files: ^src/backend/app/migrations/seed_data/light_mode\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/light_mode.schema.yaml
      - id: check-jsonschema
        name: seed schema — location_types.yaml
        files: ^src/backend/app/migrations/seed_data/location_types\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/location_types.schema.yaml
      - id: check-jsonschema
        name: seed schema — overwintering_profiles.yaml
        files: ^src/backend/app/migrations/seed_data/overwintering_profiles\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/overwintering_profiles.schema.yaml
      - id: check-jsonschema
        name: seed schema — phase_sequences.yaml
        files: ^src/backend/app/migrations/seed_data/phase_sequences\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/phase_sequences.schema.yaml
      - id: check-jsonschema
        name: seed schema — plant_info*.yaml (9 files)
        # `plant_info.*` covers plant_info.yaml, the four indoor, the three
        # outdoor and the supplement file. adventskalender.yaml declares the
        # same schema and is deliberately absent — see the list above.
        files: ^src/backend/app/migrations/seed_data/plant_info.*\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/plant_info.schema.yaml
      - id: check-jsonschema
        name: seed schema — species.yaml
        files: ^src/backend/app/migrations/seed_data/species\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/species.schema.yaml
      - id: check-jsonschema
        name: seed schema — starter_kits.yaml
        files: ^src/backend/app/migrations/seed_data/starter_kits\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/starter_kits.schema.yaml
      - id: check-jsonschema
        # substrates.schema.yaml existed and was enforced only by
        # tests/unit/migrations/test_seed_schema_conformance.py, i.e. in the
        # backend unit tier and not in the required `static` lane — so an edit to
        # either the file or the schema reached the merge queue ungated by the
        # check every sibling seed file gets. Added with #1175, which extended the
        # schema.
        name: seed schema — substrates.yaml
        files: ^src/backend/app/migrations/seed_data/substrates\.yaml$
        args:
          - --base-uri
          - file://./src/backend/app/migrations/seed_data/schemas/
          - --schemafile
          - src/backend/app/migrations/seed_data/schemas/substrates.schema.yaml

  # ── Nuclei binary pin (#1177) ────────────────────────────────────────────
  - repo: local
    hooks:
      - id: nuclei-version-pin
        name: the Nuclei binary is pinned, not `latest` (#1177)
        # `always_run`, because the thing this catches is not a change to any
        # file the hook could be selected by: leaving `nuclei-action` on its
        # `latest` default let the template gate report green on an uncompilable
        # critical-severity template for two weeks, and what ended that was an
        # upstream release, not a commit here.
        entry: python3 scripts/check_nuclei_version_pin.py
        language: python
        always_run: true
        pass_filenames: false

  # ── Backend (Python) ──────────────────────────────────────────────────
  # Uses ruff via pip (not the pre-commit mirror) to support py314 target-version.
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check (backend)
        entry: bash -c 'cd src/backend && ruff check --fix "${@/#src\/backend\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^src/backend/.*\.py$
        types: [python]
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd src/backend && ruff format "${@/#src\/backend\//}"' --
        language: python
        additional_dependencies: ['ruff>=0.15.0']
        files: ^src/backend/.*\.py$
        types: [python]

  # ── Microservices / shared lib (mypy type baseline, SCR-001) ───────────
  # The backend declares mypy strict=true but ships no mypy CI step; these
  # sibling Python packages carried no static type-checker at all. A non-strict
  # mypy baseline (config in each package's pyproject.toml) now runs in the
  # required `static` gate. Each hook cd-s into its package like the ruff hooks
  # and runs in an isolated venv carrying mypy only — the packages' own
  # [tool.mypy] overrides ignore runtime imports absent from that venv. The
  # separate backend-mypy CI gap is left as a documented follow-up (not wired
  # here). pass_filenames is false so mypy sees each package as a whole module.
  - repo: local
    hooks:
      - id: mypy-kp-vectordb
        name: mypy (kp_vectordb)
        entry: bash -c 'cd src/libs/kp_vectordb && mypy kp_vectordb'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/libs/kp_vectordb/kp_vectordb/.*\.py$
        pass_filenames: false
      - id: mypy-kp-errortracking
        name: mypy (kp_errortracking)
        entry: bash -c 'cd src/libs/kp_errortracking && mypy kp_errortracking'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/libs/kp_errortracking/kp_errortracking/.*\.py$
        pass_filenames: false
      - id: mypy-knowledge-service
        name: mypy (knowledge-service)
        entry: bash -c 'cd src/knowledge-service && mypy app'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/knowledge-service/app/.*\.py$
        pass_filenames: false
      - id: mypy-inference-service
        name: mypy (inference-service)
        entry: bash -c 'cd src/inference-service && mypy app'
        language: python
        additional_dependencies: ['mypy>=1.13.0']
        files: ^src/inference-service/app/.*\.py$
        pass_filenames: false

  # ── Shared-lib copy drift (#777) ───────────────────────────────────────
  # The error-tracking module is maintained once under src/libs and copied
  # verbatim into each service, because the three Python services are separate
  # build contexts. The copies carry the PII-scrubbing rules, so a drifted copy
  # scrubs less than its siblings while looking identical from the outside.
  #
  # This runs here, in the required `static` gate, in addition to the pytest
  # guards inside the two microservices. Since #1058 those service suites DO run
  # in CI — the advisory `side-services.yml` workflow executes
  # knowledge-service/tests, inference-service/tests and kp_vectordb/tests, and
  # `task test:side-services` runs them locally (also folded into `task check`).
  # This hook stays because side-services.yml is advisory (not a required
  # branch-protection check per NFR-018 §4) while the `static` gate is required:
  # the drift class this catches must fail a REQUIRED lane, and it also fires on a
  # copy edit that changes no service's own test tree. The vectordb_sync_guard
  # tests (test_vectordb_sync_guard.py in both services) now have a CI home too.
  - repo: local
    hooks:
      - id: errortracking-sync
        name: kp_errortracking copies in sync
        entry: python src/libs/kp_errortracking/sync.py --check
        language: python
        files: ^src/(libs/kp_errortracking/kp_errortracking|backend/app/observability|knowledge-service/app/observability|inference-service/app/observability)/.*\.py$
        pass_filenames: false

  # ── Steckbrief ↔ seed consistency (Issue #680) ─────────────────────────
  # Fails the required `static` gate when a lifecycle-driving attribute
  # (growth_habit / photoperiod_type / photosynthesis_type / flowering_strategy
  # / growth_determinacy) drifts between a Steckbrief (spec/knowledge/plants/*.md)
  # and the seed YAMLs. Seed = source of truth, Steckbrief = documentation that
  # must follow it; deliberate divergences are recorded in the validator's
  # ALLOWED_DISCREPANCIES allowlist. Self-contained (stdlib + PyYAML) so it runs
  # in this isolated pre-commit venv as well as under pytest.
  - repo: local
    hooks:
      - id: steckbrief-seed-consistency
        name: Steckbrief ↔ seed consistency (#680)
        entry: python src/backend/app/migrations/seed_steckbrief_consistency.py
        language: python
        additional_dependencies: ['PyYAML>=6.0']
        always_run: true
        pass_filenames: false

  # ── Frontend (TypeScript/React) ────────────────────────────────────────
  # These hooks require node_modules — run locally only.
  # In CI, frontend linting runs via .github/workflows/frontend.yml (npm ci + eslint + tsc).
  - repo: local
    hooks:
      # Both entries route through scripts/frontend_hook.sh, which refuses to
      # report success for a check it did not run (#814). The previous inline
      # `test -d src/frontend/node_modules || exit 0` printed `Passed` when the
      # dependencies were absent — a commit that did not compile went through
      # with two green hooks.
      - id: frontend-eslint
        name: ESLint (frontend)
        entry: scripts/frontend_hook.sh eslint
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        types_or: [ts, tsx]
      - id: frontend-tsc
        name: TypeScript check (frontend)
        entry: scripts/frontend_hook.sh tsc
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ── Security (Nuclei templates) ─────────────────────────────────────────
  # Validates project-specific Nuclei templates (NFR-014 §3.2).
  #
  # The previous entry was `command -v nuclei || exit 0` inline — "if the tool is
  # absent, exit successfully". The reusable `static` job is Python-only and
  # never installs nuclei, so on the one required check of this repository the
  # hook reported Passed for a validation that examined nothing. The comment
  # here named the CI security-nuclei workflow as the authoritative gate; that
  # gate did not exist until this change created it. See the script header.
  - repo: local
    hooks:
      - id: nuclei-validate
        name: Nuclei template validate
