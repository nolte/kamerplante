##
## Frontend CI.
##
## `lint-test-build (22)` is a REQUIRED check on `develop` (#828). Before that it
## gated nothing: a pull request whose entire vitest run was red could reach
## develop as long as the two required contexts passed, and #824 (jsdom 29 -> 30,
## 71 of 361 test files red) was stopped only because someone inspected the
## advisory checks by hand.
##
## The `pull_request` trigger therefore carries NO `paths:` filter, for the same
## reason `e2e-smoke.yml` does not: a required check whose workflow is skipped by
## path filtering never reports at all, and the pull request stays stuck on
## "Expected - waiting for status to be reported". A job skipped by a job-level
## `if:` reports a conclusion that branch protection accepts, which is why the
## selection lives in the `changes` job below. The `push` trigger keeps its paths
## filter: branch protection does not read it.
##
## `Coverage / Node.js Coverage` deliberately stays advisory. Measured over the
## same 30 develop runs it failed 3 times against `lint-test-build`'s 1, which
## matches its documented history as a wandering flake — and a flaky required
## check blocks every pull request in the repository, a worse failure mode than
## the gap being closed here.
##
name: Frontend CI

on:
  push:
    branches: [develop]
    paths: ['src/frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [develop]
  schedule:
    # Weekly dependency CVE audit (NFR-009 §4.1) — runs the npm-audit jobs below
    # even when no frontend change lands, so an advisory published against an
    # unchanged lockfile still surfaces. Offset from backend.yml's Monday 05:17
    # so the two do not report at the same minute. Mondays 05:47 UTC.
    - cron: '47 5 * * 1'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/frontend

jobs:
  # Which pull requests actually need the frontend lane. Skipping here (rather
  # than at the trigger) keeps the required check reporting on every pull
  # request, including those that touch no frontend file.
  changes:
    name: Detect frontend changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/frontend.yml'

  # REQUIRED check. The job itself always runs; only its *steps* are conditional.
  #
  # A job skipped by a job-level `if:` does not expand its matrix, so GitHub
  # reports the check run as `lint-test-build` — without the ` (22)` suffix that
  # the required context carries. The required context then never reports at all
  # and every non-frontend pull request sits on "Expected — waiting for status to
  # be reported" forever. Verified the hard way: it blocked #841 and #842
  # immediately after the promotion landed.
  #
  # Running the job and skipping its steps costs a few seconds of runner time and
  # produces a green `lint-test-build (22)` on every pull request, which is what
  # branch protection needs.
  lint-test-build:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    env:
      # The run/skip decision, evaluated ONCE. Every step below gates on this
      # single value rather than restating the expression, because seven copies
      # of a condition are seven chances for one of them to drift.
      #
      # `needs.changes.result` is load-bearing and must not be dropped. Without
      # it, a `changes` job that FAILED or was cancelled leaves
      # `needs.changes.outputs.frontend` as an empty string, every comparison is
      # false, every step is skipped — and a job whose steps are all skipped
      # reports Success. The required `lint-test-build (22)` context would go
      # green without tsc, ESLint, vitest or the build ever running: a check
      # that reports on nothing is indistinguishable from one that passed.
      #
      # `result` covers failure, cancelled AND skipped, which is what makes a
      # separate event-name clause unnecessary — on push and workflow_dispatch
      # `changes` is skipped by its own `if:`, so this evaluates to true and the
      # full suite runs. Same construction as the `smoke` job in e2e-smoke.yml;
      # keep the two in step.
      RUN_FRONTEND: >-
        ${{ needs.changes.result != 'success'
            || needs.changes.outputs.frontend == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_FRONTEND == 'true'

      - name: Setup Node.js ${{ matrix.node-version }}
        if: env.RUN_FRONTEND == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Set up Task
        if: env.RUN_FRONTEND == 'true'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: env.RUN_FRONTEND == 'true'
        run: npm ci

      # Invoked through the Taskfile (continuous-integration §E). `lint:frontend`
      # previously linted only `src/` while this job linted the whole project, so
      # a green local run said nothing about the pipeline; the target was widened
      # to match rather than the gate narrowed.
      - name: TypeScript check
        if: env.RUN_FRONTEND == 'true'
        run: task typecheck

      - name: Lint
        if: env.RUN_FRONTEND == 'true'
        run: task lint:frontend

      - name: Test
        if: env.RUN_FRONTEND == 'true'
        run: task test:frontend

      - name: Build
        if: env.RUN_FRONTEND == 'true'
        run: task build:frontend

      - name: Upload build artifacts
        # Both conditions: the frontend gate above, and the pre-existing
        # develop-only restriction on publishing the artefact.
        if: env.RUN_FRONTEND == 'true' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 7

  coverage:
    name: Coverage
    needs: changes
    # `needs.changes.result` is load-bearing, for the same reason it is in the
    # `lint-test-build` job above and in e2e-smoke.yml. A failed or cancelled
    # `changes` leaves `outputs.frontend` an empty string; both remaining
    # clauses would then be false, the job would be skipped, and a job whose
    # steps are all skipped reports Success. Coverage would go green without
    # measuring anything.
    #
    # Lower stakes than `lint-test-build (22)`, which is a required context —
    # this one is advisory. It is guarded anyway because it is the same defect
    # two dozen lines from the fix for it, and the next reader copying either
    # job should copy the guarded form.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.frontend == 'true')
    uses: nolte/gh-plumbing/.github/workflows/reusable-nodejs-coverage.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      node-version: '22'
      working-directory: src/frontend
      install-command: npm ci
      test-command: npm run test:coverage
      fail-under: 80

  # UI-NFR-003 R-013/R-014/R-015/R-028 — hard gate on the initial payload size.
  # Standalone job (does not touch the required `static` check) so a budget
  # breach fails visibly without deadlocking automerge.
  bundle-budget:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run bundle:check

      - name: Upload bundle analyzer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: src/frontend/bundle-stats/stats.html
          retention-days: 7

  # UI-NFR-003 R-001..005 — Core Web Vitals measurement (mobile, 4G emulation).
  #
  # The `categories:accessibility` assertion in lighthouserc.json is ERROR-level
  # at a measured, computed baseline-and-ratchet floor (0.98, measured 2026-08-09
  # over the static dist; NFR-018 §2.1). `lhci assert` returns nonzero and this
  # job goes RED on an accessibility regression below the floor — it is no longer
  # a gate that cannot fail (#1060). There is deliberately NO job-level
  # `continue-on-error`, so the red is real. The performance assertions remain
  # warn-level (report-only) until their own baseline is stable.
  #
  # ADVISORY regardless: branch protection requires only `static / Static CI
  # Tests` and `lint-test-build (22)` (`.github/settings.yml`), and this job is
  # deliberately not among them. It is promoted to a required check on measured
  # history per NFR-018 §4, never by editing this comment.
  lighthouse:
    name: Lighthouse CI
    needs: changes
    # `needs.changes.result` is load-bearing here for the same reason it is in
    # `lint-test-build` and `coverage` above, and it was missing: with
    # `always()` the job runs even when `changes` failed, `outputs.frontend` is
    # then the empty string, both remaining clauses are false on a pull
    # request, every step is skipped — and a job whose steps are all skipped
    # reports Success. Advisory or not, a green check that measured nothing is
    # the shape NFR-018 §1 catalogues, two dozen lines from the comment saying so.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: src/frontend/.lighthouseci/
          retention-days: 7

  # Dead-component detection (2026-08-08 issue-pattern audit, measure P4.4).
  #
  # `tsc` accepts an exported React component that nothing imports and ESLint
  # never looks across files, so a finished vertical slice can be reachable from
  # no route at all. Cluster K of the audit is eight issues of exactly that
  # (#818, #786, #606, #578, #438). This job is the first thing in the
  # repository that measures it.
  #
  # ADVISORY, AND HONESTLY SO. It carries NO `continue-on-error`: the job goes
  # red when knip finds something, because a job that cannot fail is not a
  # check (NFR-018 §2). It blocks nothing regardless — branch protection
  # requires only `static / Static CI Tests` and `lint-test-build (22)`
  # (`.github/settings.yml`), and this job is deliberately not among them.
  #
  # It IS red today: 9 unreachable files and 38 unused exports as of
  # 2026-08-08, listed in full by the run. That number is not baselined away in
  # knip.jsonc on purpose — an ignore list would make the lane green while the
  # debt it exists to name sat inside it.
  #
  # PROMOTION CONDITION, so nobody has to guess: this becomes a required check
  # when (a) the finding list is empty, and (b) it has been empty across a
  # measured window of develop runs — NFR-018 §4 promotes on history, never on
  # intent. Until both hold, promoting it would block every pull request in the
  # repository on pre-existing debt.
  deadcode:
    name: Dead code (advisory)
    needs: changes
    # `needs.changes.result` for the reason given on `lighthouse` above: without
    # it a failed `changes` would skip every step and the job would report
    # Success having scanned nothing.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect unused files and exports
        # Through the Taskfile-equivalent npm script so the pipeline and a
        # contributor run the identical thing (continuous-integration §E);
        # `task lint:frontend:deadcode` is the local entry point.
        run: npm run deadcode

  # NFR-009 §4.1 — CVE audit of the SHIPPED dependency tree. The backend has
  # done this on every pull request for a long time (`pip-audit` in backend.yml);
  # the frontend had no equivalent, and Trivy only reaches `package-lock.json` at
  # CRITICAL. A *high*-severity advisory in shipped JavaScript was therefore
  # invisible to every gate in this repository — and one was sitting there.
  #
  # `--omit-dev` mirrors the backend's split: the runtime lock is audited per
  # pull request, the dev extra only weekly, because dev tooling never
  # ships. Dev dependencies are covered by the scheduled job below.
  npm-audit:
    name: Dependency CVE audit
    needs: changes
    # `needs.changes.result` guards the same false green as in `lighthouse`
    # above — and here the consequence is a CVE audit that reports clean
    # without auditing.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the gate's own dependency
        working-directory: .
        run: python3 -m pip install --user 'PyYAML==6.0.3'

      - name: Audit shipped dependencies
        # Wrapper rather than bare `npm audit --audit-level=high`, because npm
        # has no allowlist: the only ways to get a green build with a known,
        # assessed, non-applicable advisory would be to lower the threshold for
        # everything or drop the gate. Each exception is an individually
        # reviewed entry with a mandatory reason AND expiry instead.
        run: python3 ../../scripts/security/npm_audit_gate.py --omit-dev

  # Dev tooling is never shipped but should still be scanned. Weekly only, so a
  # dev-only advisory never blocks a merge while still surfacing. Mirrors the
  # backend's `pip-audit` dev step.
  npm-audit-dev:
    name: Dependency CVE audit (dev, weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Install the gate's own dependency
        working-directory: .
        run: python3 -m pip install --user 'PyYAML==6.0.3'
      - name: Audit the full dependency tree
        run: python3 ../../scripts/security/npm_audit_gate.py

  # NFR-009 §4.3 — licence allowlist for the shipped tree, the frontend pendant
  # of the backend's `pip-licenses` gate. The allowlist enumerates the licences
  # actually present today (MIT 151, ISC 14, BSD-3-Clause 4, Apache-2.0 1,
  # "MIT AND ISC" 1 across 172 production packages), all permissive. A new
  # dependency under an unlisted licence — strong copyleft, or none at all —
  # fails this gate and has to be reviewed before adoption.
  npm-licenses:
    name: License allowlist gate
    needs: changes
    # `needs.changes.result` guards the same false green as in `lighthouse`
    # above — here it would be a licence gate reporting clean without reading
    # a single package's licence.
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce license allowlist
        # `--excludePackages` drops the workspace package itself: it is private,
        # so the scanner reports it as UNLICENSED even though package.json
        # declares MIT.
        run: |
          npx --yes license-checker-rseidelsohn@4.4.2 \
            --production \
            --excludePackages 'kamerplanter-frontend@0.1.0' \
            --onlyAllow 'MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;MIT AND ISC' \
            --summary
