name: Build & Publish Container Images

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'docker/**'
      - 'spec/knowledge/rag/**'
      - 'helm/**'
      # The two in-house side services this workflow also builds and pushes.
      # They were missing here while the `changes` filter below has selected on
      # them since those jobs were added, so a develop push touching only one of
      # them ran no publish at all: 5a67d9776 (2026-07-04) changed exactly
      # `src/knowledge-service/app/service.py`, and the GitHub API reports zero
      # `docker-publish.yml` runs for that SHA. Production pulls these images by
      # `:latest`, so the consequence was a silently stale deployment rather
      # than a red check (#1313).
      - 'src/inference-service/**'
      - 'src/knowledge-service/**'
      # The four scripts the publishing jobs execute. Named individually rather
      # than as `scripts/ci/**`: the other files there belong to the
      # release-lag, delivery-run and deployed-build lanes, and this workflow
      # builds and pushes eight images — widening it to the whole directory
      # would spend a full delivery run on a change it cannot affect. The
      # precision is safe to maintain because
      # `scripts/check_workflow_gate_integrity.py` now refuses a script this
      # workflow runs that is absent from this list.
      - 'scripts/ci/determine_chart_version.sh'
      - 'scripts/ci/pin_chart_image_digests.sh'
      - 'scripts/ci/publish_release_asset.sh'
      - 'scripts/check_chart_image_digests.py'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# Least privilege at the workflow level; every write scope is granted on the
# job that needs it (§B of the GitHub-Actions spec). Before this, all eight
# build jobs carried `contents: write` although only the two publishing jobs
# use it.
permissions:
  contents: read

# A delivery workflow, so runs are serialised but NEVER cancelled: cutting one
# in flight can leave a tag pushed and its attestation missing. Two quick merges
# to develop used to race each other's `latest` push with nothing serialising
# them.
#
# THE `changes` FAN-OUT (2026-08-08 `scripts/check_workflow_gate_integrity.py`;
# corrected 2026-08-22, #1223). All eight build jobs below combine `always()`
# with `needs.changes.outputs.<x> == 'true'` and never consult
# `needs.changes.result`. Until #1223 this note claimed that a failed or
# cancelled `changes` therefore leaves the lane publishing nothing while
# "nothing is red", and proposed `needs.changes.result != 'success' ||` as the
# repair. Measured, both halves are wrong, so the note is corrected rather than
# the code — which is exactly the failure class NFR-018 §1 catalogues, here in
# the comment that warns about it.
#
# 1. A failed `changes` IS red. The job's own conclusion reddens the run; run
#    32146552770 is the shape, with eight skipped builds and a run conclusion of
#    `failure`. What reports Success is the eight individual CONTEXTS, not the
#    run — and nothing gates on those contexts.
#
# 2. It is also alerted. Since #1225 `delivery-run-alert.yml` fires on
#    `workflow_run: workflows: ["Build & Publish Container Images"], types:
#    [completed]` and opens a deduped issue on a red run. That observer landed
#    after the note was written, so "nothing surfaces this" was true then and is
#    not now.
#
# 3. Guarding these eight the way the two publishing jobs are guarded would be
#    INERT. `needs` here is `changes` alone, so on a develop push where it fails
#    the outputs clause is already false and the job already skips; adding
#    `!contains(needs.*.result, 'failure')` reaches the same conclusion by a
#    different route. The publishing jobs need it because their `needs` also
#    carries the eight builds, whose failure would otherwise still satisfy their
#    outputs clause.
#
# 4. It would also BREAK the manual escape hatch. `changes` runs on a
#    `workflow_dispatch` against a branch (`if: github.ref_type == 'branch'`).
#    If it fails there, `github.event_name == 'workflow_dispatch'` is true today
#    and `always()` lets all eight build anyway — the rebuild-everything button
#    works. A leading guard clause evaluates false first and skips all eight,
#    disabling manual rebuild precisely when someone reaches for it BECAUSE the
#    paths filter is misbehaving.
#
# WHAT IS STILL SILENT, and what no `needs.changes.result` guard can see:
# `changes` SUCCEEDS and the filter reports `false` for everything — a base-ref
# problem, a filter typo. Then the result is `success`, every output is
# `'false'`, all eight skip, THE RUN IS GREEN, and nothing is published. That is
# the "publishes nothing, reports success" shape, and it is indistinguishable at
# the expression level from the legitimate case: a docs-only merge where
# skipping all eight is correct. Separating the two is a check of its own, not a
# guard clause, and is tracked in #1223. History as of 2026-08-22: across the
# last 40 runs `changes` concluded `success` 39x and `skipped` once (the v0.2.1
# tag run); `failure`/`cancelled` never.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    # On tags and workflow_dispatch, skip path filtering — build everything
    if: github.ref_type == 'branch'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      vectordb: ${{ steps.filter.outputs.vectordb }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      embedding-service: ${{ steps.filter.outputs.embedding-service }}
      inference-service: ${{ steps.filter.outputs.inference-service }}
      reranker-service: ${{ steps.filter.outputs.reranker-service }}
      knowledge-service: ${{ steps.filter.outputs.knowledge-service }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'src/backend/**'
            frontend:
              - 'src/frontend/**'
            vectordb:
              - 'docker/vectordb/**'
            knowledge:
              - 'docker/knowledge/**'
              - 'spec/knowledge/rag/**'
            embedding-service:
              - 'docker/embedding-service/**'
            inference-service:
              - 'src/inference-service/**'
            reranker-service:
              - 'docker/reranker-service/**'
            knowledge-service:
              - 'src/knowledge-service/**'
            helm:
              - 'helm/**'

  # gate-integrity-ok: a failed or cancelled `changes` reddens the run through
  # its own conclusion and is alerted by `delivery-run-alert.yml` (#1225), so
  # this skip cannot hide a failure. Guarding on `needs.changes.result` here
  # would be inert and would disable the workflow_dispatch rebuild; measured in
  # #1223, argued in the header note.
  build-backend:
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Scoped to the job that produces the attestation, never widened to
      # the workflow (§B/§H). `id-token` signs it, `attestations` stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_PREFIX }}/kamerplanter-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.title=kamerplanter-backend
            org.opencontainers.image.description=Kamerplanter core REST API and business logic (FastAPI) for plant lifecycle, phases, fertilizing, tasks and multi-tenant data
            org.opencontainers.image.source=https://github.com/nolte/kamerplanter
            org.opencontainers.image.vendor=Kamerplanter

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Bake the build identity into the image so the running instance can say
          # which commit it is (#1210). `labels`/`annotations` above already record
          # this on the *manifest*, but a manifest annotation is not readable from
          # inside the container and so cannot reach `GET /api/health`.
          # `github.sha` is the full 40-character SHA and the same value
          # metadata-action puts in org.opencontainers.image.revision, so the
          # endpoint and the annotation compare without truncation. Remove this line
          # and the endpoint falls back to "unknown" — never to a wrong SHA.
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build provenance, generated and signed by the platform rather than by
      # the build it attests — a build that attests to itself cannot detect its
      # own compromise (SLSA v1.0, continuous-delivery §C). Before this, none of
      # the eight images or the chart carried any provenance at all.
      #
      # This records ORIGIN, not safety: an attested image is one whose build
      # path is known, not one that has been judged secure. Security findings
      # stay with the supply-chain stages.
      - name: Attest build provenance (kamerplanter-backend)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/kamerplanter-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # gate-integrity-ok: a failed or cancelled `changes` reddens the run through
  # its own conclusion and is alerted by `delivery-run-alert.yml` (#1225), so
  # this skip cannot hide a failure. Guarding on `needs.changes.result` here
  # would be inert and would disable the workflow_dispatch rebuild; measured in
  # #1223, argued in the header note.
  build-frontend:
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Scoped to the job that produces the attestation, never widened to
      # the workflow (§B/§H). `id-token` signs it, `attestations` stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
