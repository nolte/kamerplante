      # path is known, not one that has been judged secure. Security findings
      # stay with the supply-chain stages.
      - name: Attest build provenance (kamerplanter-inference-service)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/kamerplanter-inference-service
