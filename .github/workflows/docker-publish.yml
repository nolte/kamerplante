  publish-helm-charts:
    # Ordered after the image builds since #987, and only for that reason: the
    # release pin resolves `<image>:<version>` to a DIGEST in the registry, so
    # the images have to exist before the chart is packaged. The dependency is
    # real either way — a chart released ahead of its images references
    # something unpullable — it was just never expressible while the pin was a
    # string substitution that could not fail.
    #
    # `always()` in the condition keeps the develop path intact: on a push that
    # touches only `helm/**` every build job is skipped, and a skipped `needs`
    # would otherwise skip this job too. Nothing here consumes a build output,
    # so a skipped build is fine; a FAILED one is not, hence the failure guard.
    needs:
      - changes
      - build-backend
      - build-frontend
      - build-vectordb
      - build-knowledge
      - build-embedding-service
      - build-inference-service
      - build-reranker-service
      - build-knowledge-service
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.helm == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` for the release-asset upload only; the chart push
      # itself needs `packages: write`.
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        chart:
          - kamerplanter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Same resolution as before — `${REF_NAME#v}` on a tag ref, empty on a
      # branch push — plus one rejection: a release tag whose first pre-release
      # identifier is `dev` fails the job here (#1222).
      #
      # `helm/*/Chart.yaml` carries a `-dev` version on develop so that a
      # `helm/**` merge can never publish under a released version, and
      # `scripts/check_chart_develop_version.py` enforces that in the required
      # `static` lane. That static rule is only SUFFICIENT while no release tag
      # carries a `-dev` pre-release: `v0.3.0-dev` would resolve here to
      # `0.3.0-dev`, and the release would be published under precisely the OCI
      # tag every develop merge rewrites. The reservation is what makes the
      # static guard's premise a rule instead of an assumption. It sits in this
      # step because it must fire BEFORE `helm package`/`helm push` below —
      # rejecting afterwards would leave the artifact published. `-rc`/`-beta`
      # release tags stay legal; see the script header for the full reasoning.
      - name: Determine chart version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/ci/determine_chart_version.sh

      - name: Update chart version for release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART: ${{ matrix.chart }}
        run: |
          set -euo pipefail
          yq -i ".version = \"$VERSION\" | .appVersion = \"$VERSION\"" "helm/$CHART/Chart.yaml"

      - name: Pin image digests in chart values for release
        if: steps.version.outputs.version != '' && matrix.chart == 'kamerplanter'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART: ${{ matrix.chart }}
          # Used for the registry token exchange. Anonymous access works for the
          # public packages today; this keeps working if one is ever made private.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Rewrites `.tag` to `<version>@sha256:<digest>` and re-reads the file to
        # prove it, both in one script so the check cannot drift from the change
        # it checks. Until #987 this step pinned the bare version: better than
        # the `:latest` the develop tree carried, but a version tag is immutable
        # only by convention — republish it and every consumer silently follows.
        # The digest is resolved from the registry, which also proves the images
        # for this release actually exist (see the `needs:` on this job).
        run: scripts/ci/pin_chart_image_digests.sh "helm/$CHART/values.yaml" "$VERSION"

      - name: Prove every Kamerplanter image in the release chart is digest-pinned
        if: steps.version.outputs.version != '' && matrix.chart == 'kamerplanter'
        # Independent of the script above, which re-reads its own output: this
        # walks every values file by YAML path, refuses any owned image without
        # `@sha256:`, and refuses one repository pinned to two digests in one
        # file. Until 2026-09-10 it ran in the required `static` gate against
        # develop-side `latest@sha256` pins that Renovate maintained; those pins
        # fed no deployment and are gone, so the guard moved to the only place a
        # pin now exists — the release.
        run: python3 scripts/check_chart_image_digests.py

      # TWO logins to the same registry, and both are load-bearing (#1218).
      #
      # `helm registry login` writes Helm's OWN credential store; `helm push`
      # below reads that one. `actions/attest-build-provenance` with
      # `push-to-registry: true` reads ~/.docker/config.json and nothing else
      # (its dist/index.js `getRegistryCredentials`), so without the step below
      # it fails with "No credentials found for registry ghcr.io" — the file
      # exists, it just has no ghcr.io entry. That cost v0.1.0 and v0.2.0 their
      # chart, compose file, env example and the Packages block of their notes:
      # the attest step died, and `update-release-assets` is gated on this job
      # not failing, so the upload never ran.
      #
      # The eight image jobs above have carried this step all along, which is
      # why their identical attest steps succeed. Do not "simplify" either login
      # away; `scripts/check_attest_registry_credentials.py` fails the required
      # `static` lane if the Docker-store login goes missing.
      - name: Log in to GHCR (Docker credential store, for the attestation)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build chart dependencies
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/
          helm repo add ollama https://otwld.github.io/ollama-helm/
          helm dependency build helm/${{ matrix.chart }}

      - name: Package chart
        run: helm package helm/${{ matrix.chart }}

      - name: Push chart to GHCR
        id: push
        env:
          CHART: ${{ matrix.chart }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          # `helm push` reports the pushed manifest digest on stderr; capture it
          # so the chart can be attested by digest like the images are.
          helm push "$CHART"-*.tgz "oci://$IMAGE_PREFIX/charts" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          if [[ -z "$digest" ]]; then
            echo "::error::helm push reported no digest — refusing to attest a chart we cannot identify." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Chart digest: $digest"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/charts/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Upload chart as release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHART: ${{ matrix.chart }}
          TAG: ${{ github.ref_name }}
        # No --clobber: a published asset is never replaced in place. The re-run
        # path stays idempotent through comparison instead — see the script
        # header. `tar-content` rather than `bytes` because `helm package` stamps
        # tar headers with time.Now(), so an identical chart repackaged is never
        # byte-identical and a byte comparison would fail every legitimate re-run.
        run: scripts/ci/publish_release_asset.sh "$TAG" tar-content "$CHART"-*.tgz

  update-release-assets:
    needs: [build-backend, build-frontend, build-vectordb, build-knowledge, build-embedding-service, build-inference-service, build-reranker-service, build-knowledge-service, publish-helm-charts]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate and upload docker-compose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"
          sed "s/__VERSION__/${VERSION_NUM}/g" docker-compose.release.yml > "docker-compose-${VERSION_NUM}.yml"
          cp .env.example ".env.example-${VERSION_NUM}"
          # Both files are deterministic for a given tag (sed over the tagged
          # tree, and a plain copy), so a byte comparison is the right test: a
          # re-run producing different bytes under a published tag is a defect,
          # not something to overwrite.
          scripts/ci/publish_release_asset.sh "$VERSION" bytes \
            "docker-compose-${VERSION_NUM}.yml" ".env.example-${VERSION_NUM}"

      - name: Update release body with package links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"

          # Delimited by stable markers so a re-run REPLACES the block instead of
          # appending a second copy. The previous version concatenated the
          # existing body with a freshly built section, so every re-run (a
          # workflow_dispatch, a retry of a flaky upload) duplicated it.
          BEGIN="<!-- kp:packages:begin -->"
          END="<!-- kp:packages:end -->"

          PACKAGES=$(cat <<EOF
          $BEGIN

          ## Packages

          ### Container Images
          - \`ghcr.io/${OWNER}/kamerplanter-backend:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-frontend:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-vectordb:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-knowledge:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-embedding-service:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-inference-service:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-reranker-service:${VERSION_NUM}\`
          - \`ghcr.io/${OWNER}/kamerplanter-knowledge-service:${VERSION_NUM}\`

          Every image and the chart carry signed build provenance. Verify before
          deploying:

          \`\`\`bash
          gh attestation verify oci://ghcr.io/${OWNER}/kamerplanter-backend:${VERSION_NUM} --repo ${REPO}
          \`\`\`

          Provenance records the build ORIGIN — which commit, which workflow run,
          which pinned inputs. It is not a statement that the artifact is secure.

          ### Helm Chart
          - \`oci://ghcr.io/${OWNER}/charts/kamerplanter:${VERSION_NUM}\`

          \`\`\`bash
          helm pull oci://ghcr.io/${OWNER}/charts/kamerplanter --version ${VERSION_NUM}
          \`\`\`

          ### Docker Compose
          \`\`\`bash
          curl -LO https://github.com/${REPO}/releases/download/${VERSION}/docker-compose-${VERSION_NUM}.yml
          curl -LO https://github.com/${REPO}/releases/download/${VERSION}/.env.example-${VERSION_NUM}
          cp .env.example-${VERSION_NUM} .env   # edit passwords!
          docker compose -f docker-compose-${VERSION_NUM}.yml up -d
          \`\`\`
          $END
          EOF
          )

          BODY=$(gh release view "$VERSION" --json body -q .body)
          # Strip any previous block, then append the current one.
          STRIPPED=$(printf '%s' "$BODY" | awk -v b="$BEGIN" -v e="$END" '
            $0 == b {skip=1} !skip {print} $0 == e {skip=0}
          ')
          printf '%s\n%s\n' "$STRIPPED" "$PACKAGES" > release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md
