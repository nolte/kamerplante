  # this skip cannot hide a failure. Guarding on `needs.changes.result` here
  # would be inert and would disable the workflow_dispatch rebuild; measured in
  # #1223, argued in the header note.
  build-inference-service:
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.inference-service == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
