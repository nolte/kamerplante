          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_PREFIX }}/kamerplanter-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.title=kamerplanter-frontend
            org.opencontainers.image.description=Kamerplanter web UI (React single-page app served by nginx) for managing plants, locations, tasks and dashboards
            org.opencontainers.image.source=https://github.com/nolte/kamerplanter
            org.opencontainers.image.vendor=Kamerplanter

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build provenance, generated and signed by the platform rather than by
      # the build it attests — a build that attests to itself cannot detect its
      # own compromise (SLSA v1.0, continuous-delivery §C). Before this, none of
      # the eight images or the chart carried any provenance at all.
      #
      # This records ORIGIN, not safety: an attested image is one whose build
      # path is known, not one that has been judged secure. Security findings
      # stay with the supply-chain stages.
      - name: Attest build provenance (kamerplanter-frontend)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/kamerplanter-frontend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # gate-integrity-ok: a failed or cancelled `changes` reddens the run through
  # its own conclusion and is alerted by `delivery-run-alert.yml` (#1225), so
  # this skip cannot hide a failure. Guarding on `needs.changes.result` here
  # would be inert and would disable the workflow_dispatch rebuild; measured in
  # #1223, argued in the header note.
  build-vectordb:
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.vectordb == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Scoped to the job that produces the attestation, never widened to
      # the workflow (§B/§H). `id-token` signs it, `attestations` stores it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

