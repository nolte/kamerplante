name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must match an open release-drafter draft)."
        required: true
        type: string
      dry_run:
        description: "Validate without flipping draft=false."
        required: false
        type: boolean
        default: false

# When `vars.PORTFOLIO_APP_ID` is set, the reusable mints a short-lived
# GitHub-App installation token from `secrets.PORTFOLIO_APP_PRIVATE_KEY`
# and uses it for `gh release edit --draft=false`. App-authored
# release:published events cascade to release-cd-refresh-master and
# release-cd-deliver-docs; GITHUB_TOKEN-authored ones don't.
# See spec/project/workflow-health/ §Known platform constraints (#330)
# and docs/<lang>/portfolio-app/ for setup.
#
# Backwards compatibility: when `vars.PORTFOLIO_APP_ID` is unset, the
# reusable falls through to `secrets.token` (= GITHUB_TOKEN). The
# release publish step still works; the cascade gap remains and the
# workflow_dispatch escape hatch on release-cd-refresh-master.yml
# stays load-bearing.

# Read-only floor. Both jobs below declare the `contents: write` they need
# themselves. Deliberately NO workflow-level concurrency: `openapi-asset` carries
# its own per-tag group (see the comment on that job), and a release workflow
# must never cancel a run in flight.
permissions:
  contents: read

jobs:
  # OpenAPI document as a release asset (issue #765).
  #
  # Why here and not in the reusable: the reusable publish workflow exposes no
  # generic asset hook — its only asset input (`asset-filename`) is
  # HACS-specific — and it is externally managed, so the upload has to live in
  # the caller. It re-implements the reusable's own checkout contract instead:
  # `ref: develop`, so the export comes from exactly the tree that is being
  # released, no matter which ref the workflow_dispatch was fired from.
  #
  # Why `needs:` orders it before the flip: `publish` flips the draft to
  # published, and that release:published event immediately cascades to
  # release-cd-refresh-master and release-cd-deliver-docs. Uploading afterwards
  # would leave a window in which the release is public but missing the
  # document that docs/<lang>/api/overview.md, Taskfile.yaml and the
  # export_openapi module docstring all promise. So the asset lands on the
  # still-draft release first. `gh release upload` resolves the release object
  # by tag name and handles drafts (the tag itself only becomes a git ref at
  # publish time) — the same resolution the reusable's "Resolve draft" step
  # relies on. The explicit verification step exists so that if that assumption
  # ever breaks, the job fails loudly instead of shipping an incomplete release.
  #
  # dry_run: the export still runs (a broken export must surface during a dry
  # run), only upload and verification are skipped via a visible step-level
  # `if:`. Deliberately no `continue-on-error` anywhere — a failed export or
  # upload blocks the release; that is the better outcome.
  #
  # Credentials: the App token is minted inside the reusable and is not
  # available to the caller's own jobs, so `gh` runs on GITHUB_TOKEN, which the
  # job-level `contents: write` (not inherited from the reusable) covers.
  openapi-asset:
    name: Attach OpenAPI document
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level concurrency, deliberately NOT workflow-level and deliberately
    # NOT the group name `release-publish`: the reusable declares that group for
    # its own job, and a caller run holding it while the reusable job it calls
    # queues on the same group would block itself. An own group per tag serialises
    # two parallel dispatches of the same tag (both would export and upload)
    # without touching the reusable's group. `cancel-in-progress: false` so an
    # upload in flight is never cut off half-way.
    concurrency:
      group: release-publish-openapi-asset-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install dependencies
        # Hash-verified lock via `uv sync --locked` — same install truth as api-docs.yml.
        working-directory: src/backend
        run: |
          python -m pip install 'uv==0.12.13'
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Export OpenAPI document
        working-directory: src/backend
        run: python -m scripts.export_openapi --out openapi.json

      - name: Resolve the release for the requested tag
        # Diagnostics only, deliberately narrow in scope: this job now fails
        # before the reusable's own `Resolve draft` step ever runs, so a typo in
        # `tag` would otherwise surface as a raw `gh` error without the list of
        # open drafts that used to make the mistake obvious. This step brings
        # exactly that list back — nothing more. Do NOT grow it into a copy of
        # the reusable's validation: the `target_commitish` check against
        # origin/develop and the "exactly one draft" rule stay the reusable's
        # responsibility, or the two implementations drift apart.
        #
        # Same `if:` as upload and verify: a dry run uploads nothing and so needs
        # no draft, and it goes on to `publish`, where the reusable emits its own
        # fuller diagnostics. Both paths keep good error messages.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json tagName >/dev/null; then
            echo "::error::No release with tag '$TAG'. Open drafts:"
            # Diagnostics printed on the way to the `exit 1` below. The marker
            # sits on the `|| true` line itself because the line above it is a
            # backslash continuation, not a comment.
            gh release list --limit 50 --json tagName,isDraft \
              --jq '.[] | select(.isDraft) | "  - " + .tagName' || true  # gate-integrity-ok: the verdict is the exit 1 on the next line; a failed listing costs the operator a hint, not the failure
            exit 1
          fi
          echo "Resolved release $TAG."

      - name: Upload OpenAPI document to the draft release
        if: ${{ !inputs.dry_run }}
        working-directory: src/backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Stable, unversioned asset name: consumers can always fetch
          # .../releases/latest/download/openapi.json (docs/<lang>/api/overview.md).
          # Versioning the name to sidestep the re-run collision would break that
          # permalink, so idempotence is solved by comparison instead of by
          # renaming — and never by --clobber, which would let a re-dispatch
          # rewrite a published document under an unchanged tag.
          #
          # This step runs BEFORE the draft is flipped, so an ordinary
          # re-dispatch replaces a draft asset and stays green. Only a dispatch
          # against an ALREADY-PUBLISHED tag is refused, and only when the export
          # differs — which it can, because the checkout above is `ref: develop`
          # rather than the draft's target commit.
          "$GITHUB_WORKSPACE/scripts/ci/publish_release_asset.sh" "$TAG" bytes openapi.json

      - name: Verify the OpenAPI asset is attached
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json assets \
            | jq -e '[.assets[].name] | index("openapi.json") != null' >/dev/null; then
            echo "::error::openapi.json is not attached to release $TAG — the upload did not take effect." >&2
            exit 1
          fi
          echo "Verified: openapi.json is attached to release $TAG."

  publish:
    # Gate the draft -> published flip on the asset being in place; see the
    # comment block on openapi-asset above.
    needs: openapi-asset
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write
