name: Security — Nuclei Post-Merge Scan

# NFR-014 §4.1/§4.3 — fast template-based DAST scan against an ephemeral
# Kamerplanter stack.
#
# WHY THIS IS NO LONGER A PER-PUSH PULL-REQUEST LANE (2026-08-07, issue #993).
#
# It was one until this commit, and it never finished. Measured over the 100
# most recent runs, window from 2026-08-05T21:15:
#
#     cancelled 85 · success 7 · failure 6 · running 2
#
# — and of the 20 most recent, every single one cancelled. A complete scan takes
# 16-19 minutes (e.g. 14:27:18 -> 14:43:31). Two things cancel it, and both tick
# faster than that:
#
#   1. Any further push to the head branch superseded the run in flight, via the
#      `cancel-in-progress: true` this block used to carry: a follow-up commit, a
#      Renovate update, or the rebase that `strict: true` forces after any other
#      pull request merges.
#   2. The pull request itself is merged by the `automerge` label as soon as the
#      two REQUIRED contexts report — minutes, not tens of minutes. See
#      `automerge.yaml`. The scan loses to the merge of its own pull request.
#
# Neither `cancel-in-progress: false` nor a narrower `paths:` filter fixes that.
# The filter (kept below, and in place unchanged since 2026-08-01, i.e. through
# the entire measured window) decides how OFTEN the lane fires, not whether a
# firing run reaches its verdict; never superseding would scan every
# intermediate commit of a push burst at 16-19 minutes each and still lose to
# cause 2. What was wrong is the PLACEMENT of a 16-to-19-minute job on a
# per-push trigger in a repository that merges through `automerge` under
# `strict: true` — not the concurrency setting. The in-repo evidence that
# duration is the variable: `.github/settings.yml` measured `e2e-smoke`
# (~11 min, identical concurrency shape) at 7 completed / 3 cancelled in the
# same kind of merge train. 70% against this lane's 15%.
#
# So the scan now runs ONCE PER MERGED COMMIT, where nothing races it and every
# finding maps to exactly one squash commit. This is a deliberate, recorded
# REDUCTION IN COVERAGE per NFR-018 §4, not a repair: a High/Critical finding is
# now reported AFTER the merge rather than beside it. It costs nothing that was
# actually being delivered — this check has never been required
# (`.github/settings.yml` requires only `static / Static CI Tests` and
# `lint-test-build (22)`), and a cancelled run blocks nothing and reports
# nothing. Promotion to a required check stays out of the question until there
# is measured history to justify it (NFR-018 §4); making a check that never
# completes blocking would be strictly worse than today.
#
# `main` is deliberately NOT in the push list: it only ever fast-forwards to a
# commit already scanned on `develop`.
#
# PRE-MERGE SCANNING REMAINS AVAILABLE ON DEMAND: label a pull request
# `security-scan`. Use it for a change that moves the surface the custom
# templates watch — security headers, CORS, error bodies, debug endpoints, the
# frontend bundle. That lane carries NO `paths:` filter on purpose: the label IS
# the selection, and a label that silently did nothing because a path filter did
# not match would be the same class of trap this comment exists to close.
#
# RESIDUAL GAP, written down rather than left to be rediscovered: between a
# merge and the next `security-nuclei-nightly.yml` run, nothing scans the
# OpenAPI surface (§4.3) — the nightly has a single nuclei invocation, without
# `-input-mode openapi`. That window is now one merge wide instead of unbounded.
#
# PRECONDITION: this lane depends on a push to `develop` triggering workflows at
# all. A merge authored by GITHUB_TOKEN does NOT trigger downstream workflows
# (GitHub's loop guard) — `automerge.yaml` mints a GitHub-App token precisely so
# that it does, and `release-drafter.yml` carries a manual fallback because it
# was bitten by this. If `vars.PORTFOLIO_APP_ID` is ever unset, this lane stops
# firing SILENTLY. Verified before this change landed: the variable is set, and
# `docker-publish.yml` push runs match recent `develop` commits one for one.
# Re-verify with:
#
#     gh run list --workflow security-nuclei-postmerge.yml --event push --limit 20
#
# and compare against `git log origin/develop --oneline -20`.

on:
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'docker/**'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.security.override.yml'
      - 'tests/security/nuclei-templates/**'
      - 'tests/security/nuclei-suppressions.yaml'
      - 'scripts/security/**'
      - '.github/workflows/security-nuclei-postmerge.yml'
      # The shared bring-up action: without this entry a change to the stack's
      # readiness logic would land without the gate that exercises it.
      - '.github/actions/ephemeral-stack/**'
      - '.github/renovate-pins.yaml'
      # gate-integrity-ok: docs/security/nuclei-triage.md is QUOTED, not read —
      # it is a link in the body of the issue this lane opens on a High/Critical
      # finding, and no step ever opens the file. Adding it here would spend a
      # 16-to-19-minute scan of an ephemeral stack on a documentation edit, for
      # a document whose contents cannot change what the scan finds. The
      # reference must therefore stay uncovered; this is the decision, recorded
      # where the filter it declines to widen lives (#1313).

  # On-demand pre-merge scan. No `paths:` — see the header.
  pull_request:
    types: [labeled]
  workflow_dispatch:

# Read-only floor; the job below declares what it actually needs.
permissions:
  contents: read

concurrency:
  # Keyed per merged commit, or per pull request for the label lane. NEVER
  # cancel-in-progress: superseding is what broke this lane. A push run and a
  # manual dispatch of the same SHA serialise instead of racing, and
  # re-labelling to request a fresh scan queues behind the running one rather
  # than cutting it off.
  group: security-nuclei-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  nuclei-scan:
    # Renamed from "Nuclei PR-Scan (fast)": the lane no longer runs per push on
    # every pull request, and a check whose name says otherwise is the kind of
    # small untruth this whole change is about. The SARIF *categories* below
    # keep their historic names on purpose — see the comment there.
    name: Nuclei Scan (fast profile)
    # `labeled` fires for ANY label; the selection has to be made here.
    if: >-
      github.event_name != 'pull_request'
      || github.event.label.name == 'security-scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Only the post-merge lane opens issues; see the last step.
      issues: write
    # NFR-014 §4.1 used to budget 15 minutes. The measured run is 16-19,
    # dominated by building the backend and frontend images from source rather
    # than by scanning (§3.1 budgets the scan itself at < 5 min). The budget
    # line is amended in the spec rather than left silently broken; 30 keeps a
    # hung scan from occupying a runner indefinitely.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned NUCLEI_TEMPLATES_VERSION
        id: pin
        run: |
          version=$(yq e '.nuclei_templates_version' .github/renovate-pins.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::nuclei_templates_version missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          commit=$(yq e '.nuclei_templates_commit' .github/renovate-pins.yaml)
          if [[ -z "$commit" || "$commit" == "null" ]]; then
            echo "::error::nuclei_templates_commit missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned templates version: $version"

      - name: Clone & checkout pinned community templates
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/projectdiscovery/nuclei-templates.git \
            ./nuclei-templates
          git -C ./nuclei-templates fetch --depth=1 origin "$VERSION"
          git -C ./nuclei-templates checkout FETCH_HEAD

          # A tag can be moved. Assert it still points where it did when it was
          # reviewed, so a replaced template set fails the run loudly instead of
          # quietly changing what the scan covers.
          actual="$(git -C ./nuclei-templates rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::$VERSION resolves to $actual, but .github/renovate-pins.yaml records $EXPECTED_COMMIT." >&2
            echo "         The upstream tag moved. Review the change and update nuclei_templates_commit in the same pull request." >&2
            exit 1
          fi
          echo "Templates at $VERSION = $actual (matches the recorded commit)."

      - name: Build suppression flags
        id: suppress
        run: |
          flags="$(./scripts/security/build-nuclei-flags.sh | tr '\n' ' ')"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      # Bring-up, readiness probe and failure diagnostics moved into a composite
      # action so this gate and security-nuclei-nightly.yml share ONE
      # implementation. Two copies of a readiness wait-loop is how a scanner ends
      # up reporting "no findings" against a half-started backend.
      - name: Bring up ephemeral stack
        uses: ./.github/actions/ephemeral-stack

      - name: Generate OpenAPI spec from running backend
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/openapi.json -o openapi-raw.json
          jq '.openapi' openapi-raw.json

      - name: Convert OpenAPI 3.1 → 3.0 for Nuclei compatibility
        # Nuclei's input-mode parser only supports OpenAPI 3.0. Three
        # adjustments are needed:
        # 1. `exclusiveMinimum` / `exclusiveMaximum` switched from boolean
        #    (3.0) to numeric (3.1) — restore the boolean form and lift
        #    the value into a separate `minimum` / `maximum` field.
        # 2. Nullable types switched from `nullable: true` (3.0) to
        #    `type: ["foo", "null"]` (3.1) — collapse back.
        # 3. Inject a `servers` array. Nuclei refuses to scan a spec
        #    without one, and FastAPI omits `servers` whenever no
        #    `root_path` is configured.
        run: |
          jq '
            walk(
              if type == "object" then
                (if (.exclusiveMinimum? | type) == "number"
                   then .minimum = .exclusiveMinimum | .exclusiveMinimum = true
                   else . end)
                | (if (.exclusiveMaximum? | type) == "number"
                   then .maximum = .exclusiveMaximum | .exclusiveMaximum = true
                   else . end)
                | (if (.type? | type) == "array" and (.type | index("null"))
                   then .nullable = true | .type = (.type | map(select(. != "null")) | first)
                   else . end)
              else . end
            )
            | .openapi = "3.0.3"
            | .servers = [{"url": "http://127.0.0.1:8000"}]
          ' openapi-raw.json > openapi.json
          echo "Converted to: $(jq -r '.openapi' openapi.json), servers: $(jq -c '.servers' openapi.json)"

      - name: Resolve the pinned Nuclei version
        id: nuclei_pin
        # Read once, here, so the validator and every scan lane install the same
        # binary. `nuclei-action` defaults to `version: latest`; leaving it there
        # is what let this gate change meaning between two runs with no commit
        # in between (#1177).
        run: |
          set -euo pipefail
          version=$(yq e '.nuclei_version' .github/renovate-pins.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::nuclei_version missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          install-only: true
          version: ${{ steps.nuclei_pin.outputs.version }}

      - name: Run Nuclei (HTTP surface)
        # `flags` reaches the script through the environment, not through
        # `${{ }}`. It is built from tests/security/nuclei-suppressions.yaml —
        # a repository file, and therefore contributor-controlled on a fork
        # pull request. Interpolating it would expand that content into a shell
        # script, which the Actions spec forbids for any untrusted value.
        # Split into an array so each flag reaches nuclei as its own argv entry.
        #
        # TEE'd to `nuclei-run.log` for the same reason as in the nightly
        # (#1308): the step below can only assert what this scan covered by
        # reading what nuclei said about itself. "Fail on High/Critical
        # findings" further down refuses a MISSING results file, but measured on
        # v3.11.1 nuclei writes that file at zero bytes even when every target
        # was unreachable — so file presence alone cannot tell a clean scan from
        # a blind one, in this lane just as in the nightly.
        env:
          SUPPRESS_FLAGS: ${{ steps.suppress.outputs.flags }}
        run: |
          set -o pipefail
          read -ra suppress_args <<< "$SUPPRESS_FLAGS"
          nuclei \
            -t tests/security/nuclei-templates \
            -t ./nuclei-templates \
            -u http://127.0.0.1:8000 \
            -u http://127.0.0.1:5173 \
            -tags exposure,misconfig,default-login,token-spray,kamerplanter \
            -severity medium,high,critical \
            -rate-limit 50 \
            -timeout 10 \
            -no-color \
            -j -o "$GITHUB_WORKSPACE/results.jsonl" \
            -sarif-export "$GITHUB_WORKSPACE/results.sarif" \
            "${suppress_args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/nuclei-run.log"

      - name: Seed Nuclei OpenAPI fixtures (tenant + resources)
        # The Kamerplanter REST API places nearly every endpoint under
        # `/api/v1/t/{tenant_slug}/...` plus secondary keys like
        # `{species_key}` and `{run_key}`. Without resolved values nuclei
        # would either drop most requests or refuse to run. This step
        # creates one resource of each kind via the public REST API and
        # writes a `required_openapi_params.yaml` that nuclei consumes.
        run: |
          python3 scripts/security/seed-nuclei-openapi-fixtures.py
          echo "--- required_openapi_params.yaml ---"
          cat required_openapi_params.yaml

      - name: Run Nuclei (OpenAPI surface)
        if: always()
        # OpenAPI input-mode in nuclei v3 runs DAST-flavoured templates
        # against the deserialised spec (fuzzing / payload injection per
        # parameter). It explicitly ignores the regular HTTP templates
        # used by the HTTP-surface scan above. The `dast` tag and the
        # `dast` template directory below select that category.
        # `required_openapi_params.yaml` is read automatically from the
        # CWD; running from $GITHUB_WORKSPACE keeps that contract.
        # `SUPPRESS_FLAGS` via env for the reason given on the HTTP-surface step.
        env:
          SUPPRESS_FLAGS: ${{ steps.suppress.outputs.flags }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l required_openapi_params.yaml openapi.json
          read -ra suppress_args <<< "$SUPPRESS_FLAGS"
          nuclei \
            -t ./nuclei-templates/dast \
            -l openapi.json \
            -input-mode openapi \
            -skip-format-validation \
            -dast \
            -severity high,critical \
            -rate-limit 50 \
            -timeout 10 \
            -j -o openapi-results.jsonl \
            -sarif-export openapi-results.sarif \
            "${suppress_args[@]}"

      # Same verdict step as the nightly carries, for the same reason and
      # against the same measurement (#1308). Left off the OPENAPI scan
      # deliberately: `-input-mode openapi` reports its coverage differently and
      # nothing has measured what a healthy run of it prints, so an assertion
      # there would be written from a guess. Recorded here rather than left to
      # be rediscovered.
      #
      # The template floor is 100, not the nightly's 1000, and the difference is
      # not an oversight. The nightly's 1000 is anchored on a measured 5902 for
      # its tag/severity combination; this lane uses a narrower tag list and a
      # higher severity floor, and every post-merge run in the current window
      # was cancelled or skipped, so its healthy number has never been measured.
      # 100 is therefore anchored on the OTHER measurement — the in-repo custom
      # template set alone loads 5 — which is the failure mode the floor is for.
      # Raise it once a completed run measures the real figure.
      - name: Assert scan coverage and publish the verdict
        if: always()
        run: |
          set -euo pipefail
          ./scripts/security/assert-nuclei-coverage.sh \
            --label "Nuclei Scan (fast profile) — HTTP surface" \
            --log "$GITHUB_WORKSPACE/nuclei-run.log" \
            --results "$GITHUB_WORKSPACE/results.jsonl" \
            --sarif "$GITHUB_WORKSPACE/results.sarif" \
            --expect-targets 2 \
            --targets "http://127.0.0.1:8000 http://127.0.0.1:5173" \
            --min-templates 100 \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-out "$GITHUB_WORKSPACE/nuclei-coverage.json" \
            --write-empty-sarif "$GITHUB_WORKSPACE/results.sarif"

      # The two SARIF categories keep their historic names on purpose, even
      # though the workflow and the job were renamed. A Code Scanning category
      # is the key under which alerts are resolved: renaming it would orphan
      # every existing alert from the old category — they would stay open
      # forever, unmeasured, looking current. Exactly the failure class
      # NFR-018 §1 catalogues.
      - name: Upload SARIF (HTTP scan) to Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: nuclei-pr-http

      - name: Upload SARIF (OpenAPI scan) to Code Scanning
        if: always() && hashFiles('openapi-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: openapi-results.sarif
          category: nuclei-pr-openapi

      - name: Archive raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-scan-results-${{ github.sha }}
          path: |
            results.jsonl
            results.sarif
            openapi-results.jsonl
            openapi-results.sarif
            openapi.json
            nuclei-run.log
            nuclei-coverage.json
          retention-days: 90

      - name: Tear down ephemeral stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: kamerplanter-security
        run: |
          docker compose \
            -f docker-compose.e2e.yml \
            -f docker-compose.security.override.yml \
            down -v --remove-orphans

      - name: Fail on High/Critical findings
        if: always()
        run: |
          # No results file at all means the scan did not run, which is a
          # failure and not a clean result (NFR-018 §2: an empty input is not a
          # passing test). The predecessor of this step skipped every missing
          # file and exited 0, so a stack that never came up reported green.
          if [[ ! -f results.jsonl && ! -f openapi-results.jsonl ]]; then
            echo "::error::Neither results.jsonl nor openapi-results.jsonl exists — the scan produced nothing. Refusing to report a clean result for a scan that did not run."
            exit 1
          fi
          fail=0
          for f in results.jsonl openapi-results.jsonl; do
            [[ -f "$f" ]] || continue
            # gate-integrity-ok: grep -c exits 1 when the count is zero, which is
            # the clean case. The verdict is the `$hits -gt 0` comparison below
            # and the `exit "$fail"` at the end of the step; the missing-file
            # case is refused explicitly a few lines above, so an absent scan
            # cannot reach this loop and read as clean.
            hits=$(jq -r '.info.severity' "$f" | grep -cE '^(high|critical)$' || true)
            if [[ "$hits" -gt 0 ]]; then
              echo "::error file=$f::$hits High/Critical findings"
              jq -c 'select(.info.severity=="high" or .info.severity=="critical") | {id:."template-id", severity:.info.severity, host, "matched-at":."matched-at"}' "$f"
              fail=1
            fi
          done
          exit "$fail"

      # The consumer of the signal. Without this the only channel for a
      # post-merge finding is a red run in the Actions tab — precisely the alarm
      # that failed unnoticed for the nightly for months (see the header of
      # `security-nuclei-nightly.yml`). Push lane only: on a labelled pull
      # request the failing job IS the channel, and an issue would be noise.
      - name: Open issue for new High/Critical findings
        if: always() && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through `process.env`, never interpolated into the script body:
          # a `${{ }}` inside `script:` is textual substitution into JavaScript.
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const files = ['results.jsonl', 'openapi-results.jsonl'].filter(f => fs.existsSync(f));
            if (files.length === 0) {
              core.setFailed('No results file produced — the scan did not run. This is a failure, not a clean result.');
              return;
            }
            const hits = files.flatMap(f =>
              fs.readFileSync(f, 'utf8').trim().split('\n').filter(Boolean)
                .map(l => JSON.parse(l))
                .filter(r => r.info && (r.info.severity === 'high' || r.info.severity === 'critical'))
            );
            if (hits.length === 0) {
              core.notice('No High/Critical findings — no issue opened.');
              return;
            }
            const summary = hits.slice(0, 20).map(h =>
              `- \`${h['template-id']}\` (${h.info.severity}) — ${h['matched-at'] || h.host}`
            ).join('\n');
            const more = hits.length > 20 ? `\n…and ${hits.length - 20} more.` : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nuclei-postmerge] ${hits.length} High/Critical findings on ${process.env.COMMIT_SHA.slice(0, 8)}`,
              body: [
                `Post-merge Nuclei scan of \`${process.env.COMMIT_SHA}\` raised **${hits.length}** High/Critical findings.`,
                '',
                `Run: ${process.env.RUN_URL}`,
                '',
                'This commit is already on `develop`. The scan runs after the merge by',
                'design (NFR-014 §4.1) — see the header of',
                '`.github/workflows/security-nuclei-postmerge.yml` for why.',
                '',
                '## Findings (truncated to 20)',
                '',
                summary + more,
                '',
                '## Triage',
                '',
                'Follow `docs/security/nuclei-triage.md`. Confirm reproduction with',
                '`./scripts/security/nuclei-local.sh --profile pr`, then open either a',
                'fix-forward PR or a suppression PR.',
              ].join('\n'),
              labels: ['security'],
            });
