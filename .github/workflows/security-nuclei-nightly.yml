name: Security — Nuclei Nightly

# NFR-014 §4.2 — daily full-tag DAST sweep against an ephemeral stack the
# workflow starts itself, the same way the E2E suites do. Runs at 01:00
# Europe/Berlin (winter).
#
# It used to scan `vars.STAGING_BASE_URL`. That variable was never configured,
# so from the day this workflow landed until 2026-08-01 every scheduled run
# failed at the first step with "No target supplied" and no scan ever ran — and
# the only channel that would have told anyone, the "Open issue" step below,
# reports success in exactly that failure mode because without `results.jsonl`
# it emits a notice and returns. A red scheduled run in the Actions tab was the
# entire alarm. There is no staging environment to point it at, so the fix is to
# stop waiting for one: the stack is ephemeral, built from the commit under
# scan, and torn down afterwards.
#
# `target` survives as an EXPLICIT manual override for the day a deployed
# environment exists. It is deliberately not backed by a repository variable any
# more: a variable that silently redirects what gets scanned is the same class
# of trap as the one this rewrite removes.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "External base URL to scan instead of the ephemeral stack. Leave empty for the normal ephemeral run."
        required: false
        type: string

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-nuclei-nightly
  cancel-in-progress: false

jobs:
  nuclei-full-scan:
    name: Nuclei Nightly Full-Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two mutually exclusive modes, decided once so every step below reads a
      # single value instead of re-deriving the condition:
      #
      #   ephemeral == 'true'   no `target` given → start the stack, scan
      #                         127.0.0.1, tear down. This is the scheduled path.
      #   ephemeral == 'false'  an operator passed `target` → scan that, start
      #                         nothing, tear down nothing.
      #
      # An unset target is NOT an error any more; it is the normal case.
      - name: Resolve scan mode and target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # `require_lockdown` is emitted here as a plain output rather than as a
          # `cond && '' || '1'` expression on the scan step: GitHub treats the
          # empty string as falsy, so that idiom silently collapses to '1' in
          # BOTH branches and would arm the check against the very target it has
          # to stay quiet on. See the comment on that step for what it gates.
          #
          # `target_count` is DERIVED from the list below rather than written
          # out a second time, so the number the coverage gate asserts against
          # cannot drift from the number actually handed to nuclei.
          if [[ -n "${INPUT_TARGET:-}" ]]; then
            targets="$INPUT_TARGET"
            {
              echo "ephemeral=false"
              echo "targets=$targets"
              echo "require_lockdown=1"
            } >> "$GITHUB_OUTPUT"
            echo "Scanning external target: $INPUT_TARGET"
          else
            targets="http://127.0.0.1:8000 http://127.0.0.1:5173"
            {
              echo "ephemeral=true"
              echo "targets=$targets"
              echo "require_lockdown="
            } >> "$GITHUB_OUTPUT"
            echo "Scanning an ephemeral stack built from this commit."
          fi
          # Word-splitting is the intent here: the space-separated list becomes
          # the positional parameters so `$#` counts it.
          # shellcheck disable=SC2086
          set -- $targets
          echo "target_count=$#" >> "$GITHUB_OUTPUT"
          echo "Configured targets: $# ($targets)"

      - name: Read pinned NUCLEI_TEMPLATES_VERSION
        id: pin
        run: |
          set -euo pipefail
          version=$(yq e '.nuclei_templates_version' .github/renovate-pins.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::nuclei_templates_version missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          commit=$(yq e '.nuclei_templates_commit' .github/renovate-pins.yaml)
          if [[ -z "$commit" || "$commit" == "null" ]]; then
            echo "::error::nuclei_templates_commit missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned templates version: $version"

      - name: Clone & checkout pinned community templates
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/projectdiscovery/nuclei-templates.git \
            ./nuclei-templates
          git -C ./nuclei-templates fetch --depth=1 origin "$VERSION"
          git -C ./nuclei-templates checkout FETCH_HEAD

          # A tag can be moved. Assert it still points where it did when it was
          # reviewed, so a replaced template set fails the run loudly instead of
          # quietly changing what the scan covers.
          actual="$(git -C ./nuclei-templates rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::$VERSION resolves to $actual, but .github/renovate-pins.yaml records $EXPECTED_COMMIT." >&2
            echo "         The upstream tag moved. Review the change and update nuclei_templates_commit in the same pull request." >&2
            exit 1
          fi
          echo "Templates at $VERSION = $actual (matches the recorded commit)."

      - name: Build suppression flags
        id: suppress
        run: |
          flags="$(./scripts/security/build-nuclei-flags.sh | tr '\n' ' ')"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Resolve the pinned Nuclei version
        id: nuclei_pin
        # Read once, here, so the validator and every scan lane install the same
        # binary. `nuclei-action` defaults to `version: latest`; leaving it there
        # is what let this gate change meaning between two runs with no commit
        # in between (#1177).
        run: |
          set -euo pipefail
          version=$(yq e '.nuclei_version' .github/renovate-pins.yaml)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::nuclei_version missing in .github/renovate-pins.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          install-only: true
          version: ${{ steps.nuclei_pin.outputs.version }}

      # Last, so a failure in any of the cheap steps above does not first spend
      # several minutes building images.
      - name: Bring up ephemeral stack
        if: steps.target.outputs.ephemeral == 'true'
        uses: ./.github/actions/ephemeral-stack

      - name: Run Nuclei (full profile)
        env:
          # `kamerplanter-debug-endpoints.yaml` only raises a finding when this
          # is "1", and its own description says why: /docs, /redoc and
          # /openapi.json are flagged "when running against a
          # production-equivalent target", while a non-production target leaves
          # them intentionally open. The ephemeral stack is the second case — it
          # runs KAMERPLANTER_MODE=full with FastAPI's docs mounted by design.
          # Arming the check there would raise the same medium finding every
          # night, forever, against a target that is correct as built: a
          # permanent false positive is how a SARIF feed stops being read.
          KP_REQUIRE_DEBUG_LOCKDOWN: ${{ steps.target.outputs.require_lockdown }}
          TARGETS: ${{ steps.target.outputs.targets }}
          SUPPRESS_FLAGS: ${{ steps.suppress.outputs.flags }}
        run: |
          set -euo pipefail
          # Both values are space-separated lists that have to reach nuclei as
          # separate argv entries. Split them into arrays explicitly rather than
          # relying on unquoted expansion — same result, but the intent is
          # stated instead of inferred, and no shellcheck suppression is needed.
          target_args=()
          for u in $TARGETS; do target_args+=(-u "$u"); done
          read -ra suppress_args <<< "$SUPPRESS_FLAGS"

          # NOTE — keep every comment ABOVE this command, never between its
          # continued lines. A `#` on a line reached through a trailing `\`
          # terminates the logical line: bash ran `nuclei` truncated at the
          # preceding argument and then tried to execute `-tags …` as its own
          # command. That is not a hypothesis — it is what happened here from
          # 2026-08-08 to 2026-08-29, 22 consecutive red nights (#1010).
          #
          # `token-spray` in the tag list was added 2026-08-07 (#993): it only
          # ever ran in the per-push PR lane, which now runs post-merge. Without
          # it here the nightly would not be a backstop for that tag should the
          # push trigger ever stop firing. The reverse gap stands: the OpenAPI
          # surface (§4.3) still runs only in the merge lane.
          #
          # The whole run is TEE'd to `nuclei-run.log` because nuclei's coverage
          # — how many templates it loaded, how many targets answered — exists
          # ONLY in that log. It is not in the exit code and not in the result
          # files: measured on v3.11.1, a scan whose targets are all dead exits
          # 0 and writes the same zero-byte `results.jsonl` and the same absent
          # SARIF as a genuinely clean scan. The next step is what reads it.
          # `-no-color` keeps that log parseable; the run page renders it the
          # same either way. The `set -euo pipefail` at the top of this step is
          # what carries nuclei's exit code through the pipe — without pipefail
          # the `tee` would mask a failing scan behind its own exit 0.
          nuclei \
            -t tests/security/nuclei-templates \
            -t ./nuclei-templates \
            "${target_args[@]}" \
            -tags exposure,misconfig,default-login,token-spray,cve,vulnerability,kamerplanter \
            -severity low,medium,high,critical \
            -rate-limit 100 \
            -timeout 15 \
            -no-color \
            -j -o "$GITHUB_WORKSPACE/results.jsonl" \
            -sarif-export "$GITHUB_WORKSPACE/results.sarif" \
            "${suppress_args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/nuclei-run.log"

      - name: Tear down ephemeral stack
        if: always() && steps.target.outputs.ephemeral == 'true'
        run: |
          docker compose \
            -f docker-compose.e2e.yml \
            -f docker-compose.security.override.yml \
            down -v --remove-orphans
        env:
          COMPOSE_PROJECT_NAME: kamerplanter-security

      # THE STEP THAT MAKES A QUIET NIGHT MEAN SOMETHING (#1308).
      #
      # Until this existed, "0 matches" and "never scanned" were the same
      # observable state: same green job, same zero-byte `results.jsonl`, same
      # skipped SARIF upload, same "no findings" notice. Measured on the pinned
      # nuclei v3.11.1 — a scan whose targets are all unreachable exits 0 and
      # produces byte-for-byte what run 33337784895's genuine clean scan
      # produced. The exit code cannot carry this verdict, so the coverage
      # nuclei reports about itself has to.
      #
      # `always()`, so the verdict is published for a skipped scan too: when an
      # earlier step failed and nuclei never started, this writes SCAN DID NOT
      # RUN to the run page instead of leaving that to whoever opens the log.
      # That is the #1302 shape, where steps 7-11 skipped and the tail of the
      # job still looked like a quiet success.
      #
      # The template floor is a floor, not an expectation: measured, the
      # configured tag/severity combination loads 5902 templates, and the
      # in-repo custom set alone loads 5. 1000 sits far from both, so it catches
      # the community set silently dropping out without tracking upstream drift.
      - name: Assert scan coverage and publish the verdict
        if: always()
        env:
          EXPECT_TARGETS: ${{ steps.target.outputs.target_count }}
          SCAN_TARGETS: ${{ steps.target.outputs.targets }}
        run: |
          set -euo pipefail
          # Empty only if the resolve step itself never ran. Say that, rather
          # than letting the script exit 2 on a missing argument and print its
          # usage over the real cause.
          if [[ -z "${EXPECT_TARGETS:-}" ]]; then
            echo "::error::Target resolution never ran, so no scan can have happened. Refusing to report a clean result."
            exit 1
          fi
          ./scripts/security/assert-nuclei-coverage.sh \
            --label "Nuclei Nightly Full-Scan" \
            --log "$GITHUB_WORKSPACE/nuclei-run.log" \
            --results "$GITHUB_WORKSPACE/results.jsonl" \
            --sarif "$GITHUB_WORKSPACE/results.sarif" \
            --expect-targets "$EXPECT_TARGETS" \
            --targets "$SCAN_TARGETS" \
            --min-templates 1000 \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-out "$GITHUB_WORKSPACE/nuclei-coverage.json" \
            --write-empty-sarif "$GITHUB_WORKSPACE/results.sarif"

      # `hashFiles` guard as in security-nuclei-postmerge.yml: when the scan
      # never ran, this step used to fail on the missing file and add a second
      # red step that obscured the real cause further up. It now also carries a
      # zero-result SARIF on a clean night — synthesised by the step above, and
      # ONLY when that step confirmed the scan's coverage. Without it the
      # `nuclei-nightly` category was never written at all, so the Security tab
      # could not distinguish a clean nightly from a nightly that had stopped
      # running either.
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: nuclei-nightly

      - name: Archive raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-nightly-${{ github.run_id }}
          path: |
            results.jsonl
            results.sarif
            nuclei-run.log
            nuclei-coverage.json
          retention-days: 365

      - name: Open issue for new High/Critical findings
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through `process.env` rather than interpolated into the script
          # body: a `${{ }}` inside `script:` is textual substitution into
          # JavaScript, which is the script-injection shape the Actions spec
          # forbids for any value the workflow did not author itself.
          SCAN_TARGETS: ${{ steps.target.outputs.targets }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('results.jsonl')) {
              core.notice('No results.jsonl produced — skipping issue.');
              return;
            }
            const lines = fs.readFileSync('results.jsonl', 'utf8').trim().split('\n').filter(Boolean);
            const hits = lines.map(l => JSON.parse(l)).filter(r =>
              r.info && (r.info.severity === 'high' || r.info.severity === 'critical')
            );
            if (hits.length === 0) {
              core.notice('No High/Critical findings — no issue opened.');
              return;
            }
            const summary = hits.slice(0, 20).map(h =>
              `- \`${h['template-id']}\` (${h.info.severity}) — ${h['matched-at'] || h.host}`
            ).join('\n');
            const more = hits.length > 20 ? `\n…and ${hits.length - 20} more.` : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nuclei-nightly] ${hits.length} High/Critical findings on ${process.env.RUN_URL.split('/').slice(-3).join('/')}`,
              body: [
                `Nightly Nuclei scan against \`${process.env.SCAN_TARGETS}\` raised **${hits.length}** High/Critical findings.`,
                '',
                `Run: ${process.env.RUN_URL}`,
                '',
                '## Findings (truncated to 20)',
                '',
                summary + more,
                '',
                '## Triage',
                '',
                'Follow `docs/security/nuclei-triage.md`. Confirm reproduction with',
                '`./scripts/security/nuclei-local.sh --profile full <target>`,',
                'then open either a fix-forward PR or a suppression PR.',
              ].join('\n'),
              labels: ['security', 'nuclei', 'severity-high'],
            });
