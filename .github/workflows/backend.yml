name: Backend CI

on:
  # The scripts are listed beside src/backend/** because their unit tests live
  # in this suite (tests/unit/test_*_ratchet.py, test_boundary_*.py,
  # test_layer_imports_check.py, test_tenant_body_field_check.py,
  # test_workflow_gate_integrity_check.py, test_seed_catalogue_page_size_check.py,
  # test_seed_harvest_integrity_check.py) — a change to a script alone would
  # otherwise run neither its own tests nor the tree assertions they carry.
  #
  # spec/knowledge/plants/** is listed because the "Steckbrief ↔ seed
  # consistency" step below reads it: the seed side lives under src/backend and
  # was covered, the Steckbrief side was not, so a documentation-only edit that
  # introduced a drift did not reach this job at all. (It was never entirely
  # unguarded — the same validator runs always_run in the required `static`
  # lane — but a check whose two inputs hang off different triggers is one
  # rebase away from being read as covered when it is not.)
  #
  # src/backend/app/migrations/seed_data/** needs no entry: it is inside
  # src/backend/**. Said out loud because the 2026-08-08 audit listed the seed
  # files as a CI blind spot, and the blind spot was the knowledge side.
  push:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - 'spec/knowledge/plants/**'
      - 'scripts/check_schema_examples.py'
      - 'scripts/check_boundary_validation.py'
      - 'scripts/check_seed_catalogue_page_size.py'
      - 'scripts/check_seed_harvest_integrity.py'
      - 'scripts/check_layer_imports.py'
      - 'scripts/check_tenant_body_field.py'
      - 'scripts/check_workflow_gate_integrity.py'
      # The CI-alarm checks live in scripts/ci/ but their tests live in
      # src/backend/tests/unit/ (they run on a bare runner, so they are loaded
      # by path). Without these entries a pull request that touches only the
      # script or only its workflow's `github-script` body runs NONE of those
      # tests, and a skipped required check does not block a merge — the
      # closing rule could be rewritten with every guard green. (#1225)
      - 'scripts/ci/**'
      - '.github/workflows/delivery-run-alert.yml'
      - '.github/workflows/release-lag.yml'
      - '.github/workflows/release-assets-complete.yml'
      - '.github/workflows/backend.yml'
      # The Taskfile holds the lock-compiling invocation itself — the
      # `Lock staleness` job runs `task deps:check`, and every backend job
      # above runs `task lint:backend` / `task test:backend:*`. Without these
      # entries a pull request that changes the `uv lock` invocation in
      # `deps:compile` (it used to be two pip-compile lines whose flags moved
      # the lock, #903/#1296), or that rewires the include, triggers no backend
      # job at all: the gate's own definition was the one input the gate did
      # not watch.
      - '.taskfiles/backend.yaml'
      - 'Taskfile.yaml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/backend/**'
      - 'spec/knowledge/plants/**'
      - 'scripts/check_schema_examples.py'
      - 'scripts/check_boundary_validation.py'
      - 'scripts/check_seed_catalogue_page_size.py'
      - 'scripts/check_seed_harvest_integrity.py'
      - 'scripts/check_layer_imports.py'
      - 'scripts/check_tenant_body_field.py'
      - 'scripts/check_workflow_gate_integrity.py'
      # The CI-alarm checks live in scripts/ci/ but their tests live in
      # src/backend/tests/unit/ (they run on a bare runner, so they are loaded
      # by path). Without these entries a pull request that touches only the
      # script or only its workflow's `github-script` body runs NONE of those
      # tests, and a skipped required check does not block a merge — the
      # closing rule could be rewritten with every guard green. (#1225)
      - 'scripts/ci/**'
      - '.github/workflows/delivery-run-alert.yml'
      - '.github/workflows/release-lag.yml'
      - '.github/workflows/release-assets-complete.yml'
      - '.github/workflows/backend.yml'
      # The Taskfile holds the lock-compiling invocation itself — the
      # `Lock staleness` job runs `task deps:check`, and every backend job
      # above runs `task lint:backend` / `task test:backend:*`. Without these
      # entries a pull request that changes the `uv lock` invocation in
      # `deps:compile` (it used to be two pip-compile lines whose flags moved
      # the lock, #903/#1296), or that rewires the include, triggers no backend
      # job at all: the gate's own definition was the one input the gate did
      # not watch.
      - '.taskfiles/backend.yaml'
      - 'Taskfile.yaml'
  schedule:
    # Weekly dependency CVE audit (NFR-009 §4.1) — runs the pip-audit job below
    # even when no backend change lands. Mondays 05:17 UTC.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # Install from the hash-verified lock (single source of install truth,
        # NFR-009 §2.3): `uv sync --locked` refuses a lock that no longer
        # satisfies pyproject.toml and verifies every artifact against the hash
        # the lock records, then installs the app package itself editable.
        # uv is pinned like every other tool here; the pin is tracked by the
        # workflow regex manager in renovate.json5. The project environment is
        # put on PATH so the Taskfile targets below run the locked ruff/pytest.
        run: |
          python -m pip install 'uv==0.12.12'
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Invoked through the Taskfile so the pipeline and a contributor run the
      # identical thing (continuous-integration §E). Before this, `ruff format
      # --check` existed only here — there was no way to run the pipeline's
      # formatting gate locally at all.
      - name: Ruff lint
        run: task lint:backend

      - name: Ruff format check
        run: task format:backend

      - name: Steckbrief ↔ seed consistency (#680)
        # Fail the build on any non-allowlisted drift of a lifecycle-driving
        # attribute (growth_habit / photoperiod_type / photosynthesis_type /
        # flowering_strategy / growth_determinacy) between a Steckbrief
        # (spec/knowledge/plants/*.md) and the seed YAMLs. Seed = source of truth,
        # Steckbrief = documentation that must follow it (Issue #680, audit UR-2).
        # The validator walks up to the repo root itself, so the job's
        # src/backend working directory is fine. Also enforced on the required
        # `static` gate via a pre-commit hook.
        run: python app/migrations/seed_steckbrief_consistency.py --verbose

      - name: Unit tests
        run: task test:backend:unit

      - name: Contract tests
        # Enforce the plant-property contract gates that previously never ran in
        # CI: the 3-way enum single-source sync (enums.py ↔ _defs.schema.yaml ↔
        # frontend/src/api/types.ts) and the de/en i18n completeness of those
        # enums (tests/contracts/test_plant_property_enum_sync.py). These guard
        # exactly the drift class the plant-property data-model plan addresses.
        run: task test:backend:contracts

      - name: API tests
        # The router tier, which ran in no gate at all until 2026-08-05 although
        # it needs no service: it drives the FastAPI app through TestClient
        # against fakes. Measured with no ArangoDB, Valkey or S3 reachable: 480
        # passed, 0 skipped, ~60 s. It carries acceptance coverage nothing else
        # here does — among it the cross-tenant negative tests on the diary
        # endpoints (tests/api/test_plant_diary_router.py) and the MCP
        # error-envelope wire test. `tests/integration/` is deliberately still
        # absent: it needs a real ArangoDB, and without one it self-skips and
        # would report green having tested almost nothing. The Taskfile comment
        # above these targets carries the full tier map.
        run: task test:backend:api

  lock-staleness:
    name: Lock staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Set up Task
        # Needed because this job now delegates to the Taskfile instead of
        # duplicating the compile invocation (see the next step).
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        run: python -m pip install 'uv==0.12.12'
      - name: Check the lock against pyproject.toml
        # `task deps:check` is the first half of this gate: `uv lock --check`
        # fails when src/backend/uv.lock does not satisfy pyproject.toml,
        # without touching the file. The Taskfile is the only copy of the
        # invocation, so this job and `task deps:compile` cannot disagree.
        #
        # This used to recompile both pip-compile locks and diff them, which
        # made the gate a function of a whole pinned Python toolchain (pip,
        # pip-tools, click, setuptools — #929, #1296). uv resolves from the
        # lock's own recorded inputs, so the only version this job depends on
        # is uv's, pinned above.
        run: |
          if ! task deps:check; then
            echo "::error::src/backend/uv.lock is stale. Run 'task deps:compile' and commit the result." >&2
            exit 1
          fi
      - name: Verify every artifact hash the lock records
        # The second half. `uv lock --check` compares the lock against
        # pyproject.toml and nothing else — measured with uv 0.12.12: a lock
        # with every hash line altered still passes it. The old gate diffed a
        # recompiled lock against the committed one and therefore caught a
        # hand-edited hash or an in-range version swap; only an install does
        # that now. `--no-install-project` keeps it to the dependency set the
        # image ships, and `--locked` refuses to re-resolve.
        run: uv sync --locked --no-install-project

  pip-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install uv and pip-audit
        # Both pinned. An unpinned scanner is a floating input: the same commit
        # can pass today and fail tomorrow because the tool changed, which makes
        # a red run unattributable (continuous-integration §C).
        run: python -m pip install 'uv==0.12.12' 'pip-audit==2.10.1'
      - name: Export the locks in the format pip-audit reads
        # pip-audit has no uv.lock reader, so the lock is exported — versions and
        # hashes verbatim, the project itself omitted — into requirements files
        # that exist only for the length of this job. `--locked` refuses to
        # export from a lock that no longer satisfies pyproject.toml.
        run: |
          uv export --locked --no-emit-project --format requirements.txt -o /tmp/requirements.txt
          uv export --locked --no-emit-project --extra dev --format requirements.txt -o /tmp/requirements-dev.txt

      - name: Audit pinned dependencies for known CVEs
        # Audits the exact committed lock that ships (NFR-009 §4.1). Runs on every
        # PR, every push to develop, and weekly via the schedule trigger above.
        # --strict fails (instead of silently skipping) if any package cannot be
        # audited; --desc prints each advisory description; --no-deps audits the
        # precise pinned versions of the full exported lock without re-resolving
        # from PyPI, so the audit matches what the image ships. PR-blocking.
        run: pip-audit --strict --desc --no-deps --requirement /tmp/requirements.txt

      - name: Audit dev-tool dependencies for known CVEs (weekly)
        # Dev tooling (pytest/mypy/moto/black/ruff and their transitive deps) is
        # never shipped but should still be scanned. This runs only on the weekly
        # schedule, so it never blocks a PR merge while still surfacing dev-tool
        # CVEs on the nightly/weekly signal (NFR-009 §4.1). No continue-on-error:
        # a scheduled run is not a PR check, so a real finding fails the scheduled
        # workflow (visible) without gating any pull request.
        if: github.event_name == 'schedule'
        run: pip-audit --strict --desc --no-deps --requirement /tmp/requirements-dev.txt

  pip-licenses:
    name: License allowlist gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Install dependencies and pip-licenses
        # The license scanner reads installed package metadata, so the pinned set
        # must be installed first (NFR-009 §4.3).
        run: |
          python -m pip install 'uv==0.12.12'
          uv sync --locked --no-install-project
          uv pip install 'pip-licenses==5.5.5'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Enforce license allowlist
        # Fail the build on any dependency whose license is outside the allowlist
        # (NFR-009 §4.3). The allowlist enumerates the license strings actually
        # present in the current lock — all permissive or weak-copyleft (LGPL/MPL),
        # which are safe for a server-side, non-distributed application. A new
        # dependency under an unlisted license (e.g. strong-copyleft GPL/AGPL, or
        # a package with no license metadata reported as "UNKNOWN") is not in the
        # list and therefore fails the gate and must be reviewed before adoption.
        #
        # --ignore-packages excludes four already-reviewed dependencies whose PyPI
        # metadata carries multi-license strings that pip-licenses cannot match via
        # the ';'-separated allowlist, or a stray classifier:
        #   * python-dateutil — "Apache Software License; BSD License"  (dual permissive)
        #   * uvloop          — "Apache Software License; MIT License"  (dual permissive)
        #   * qrcode          — "BSD License; Other/Proprietary License" (project is BSD;
        #                        the proprietary classifier is a known metadata artifact)
        #   * pyphen          — GPLv2+ / LGPLv2+ / MPL-1.1 tri-license, used under the
        #                        permissive MPL-1.1 / LGPL option (weasyprint hyphenation)
        run: |
          pip-licenses \
            --from=mixed \
            --ignore-packages python-dateutil uvloop qrcode pyphen \
            --allow-only='MIT;MIT License;MIT-0;MIT-CMU;MIT OR Apache-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;Apache License 2.0;Apache Software License;Apache-2.0;Apache-2.0 AND MIT;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;ISC License (ISCL);Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;LGPL-2.1-or-later;LGPL-3.0-only;The Unlicense (Unlicense)'

  coverage:
    name: Coverage
    uses: nolte/gh-plumbing/.github/workflows/reusable-python-coverage.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      python-version: '3.14'
      working-directory: src/backend
      # Same install as lint-test above. `$GITHUB_PATH` persists across the
      # steps of the reusable job, so the bare `pytest` and `coverage` it runs
      # afterwards resolve to the synced project environment.
      install-command: python -m pip install 'uv==0.12.12' && uv sync --locked --extra dev && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      coverage-source: app
      fail-under: 60
